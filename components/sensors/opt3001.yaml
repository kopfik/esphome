## components/sensors/opt3001.yaml
#
# Inline:
#   opt3004: !include { file: components/sensors/opt3001.yaml, vars: { id: opt3004, address: 0x45, update_interval: 2, window_size: 30 } }
#
# Block:
#   opt3004: !include
#     file: components/sensors/opt3001.yaml
#     vars:
#       id: opt3004
#       address: 0x45
#       update_interval: 2
#       window_size: 30

sensor:

  # ==========================================================
  # --- 1. RAW SENZORY (Internal, sypou data s TS do MQTT) ---
  # ==========================================================

  - platform: opt3001
    id: ${id}_lux_raw
    address: ${address}
    internal: true
    update_interval: ${update_interval}s
    on_value:
      then:
        - script.execute: { id: mqtt_publish_json, sub_topic: "lux_${id}", value: !lambda 'return x;', decimals: 0 }

  # ==========================================================
  # --- 2. PRŮMĚROVANÉ SENZORY PRO HA (60s PRŮMĚRY) ---
  # ==========================================================

  - platform: copy
    source_id: ${id}_lux_raw
    name: "lux_${id}"
    filters:
      - sliding_window_moving_average:
          window_size: ${window_size}
          send_every: ${window_size}
