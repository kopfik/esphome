## components/sensors/paj7620.yaml
#
# Inline:
#   paj7620: !include { file: components/sensors/paj7620.yaml, vars: { id: gy_paj7620, internal: false } }
#
# Block:
#   paj7620: !include
#     file: components/sensors/paj7620.yaml
#     vars:
#       id: gy_paj7620
#       internal: false
#
# Pulls an external_component (github) and uses the topic_prefix substitution + sntp_time in its lambda.
#
# POZOR -- JEN FRAMEWORK ARDUINO. Externi komponenta (AdamM68/paj7620-esphome,
# paj7620.h) sklada gesto do Arduino typu `String`, ktery ve frameworku esp-idf
# neexistuje. Na esp-idf desce preklad spadne na:
#   error: 'String' was not declared in this scope; did you mean 'StringRef'?
# Pouzivat s boards/esp32-s3-zero-arduino.yaml, ne s *-esp-idf.yaml.
# (Zjisteno v CI 2026-09-15, tests/devices/s3z-maly-meteohub.yaml.)
# Komponenta se stahuje z GitHubu pri kazdem prekladu -- kdyby ji autor smazal
# nebo zmenil, rozbije se to bez zmeny v tomhle repu.

external_components:
  - source: github://AdamM68/paj7620-esphome
    components: [paj7620]

text_sensor:
  - platform: paj7620
    id: ${id}
    name: "gesture_${id}"
    icon: "mdi:gesture-swipe"
    internal: ${internal}

    on_value:
      then:
        - lambda: |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return;

            std::string full_topic = std::string("${topic_prefix}/gesture_${id}");

            // ts stejne jako packages/mqtt_publish_json.yaml -- gettimeofday()
            // misto timestamp * 1000 + millis() % 1000 (tam je vysvetleni proc).
            struct timeval tv;
            gettimeofday(&tv, nullptr);
            int64_t ts_ms = (int64_t)tv.tv_sec * 1000LL + (int64_t)(tv.tv_usec / 1000);

            char payload[128];
            snprintf(
              payload,
              sizeof(payload),
              "{\"value\":\"%s\",\"ts\":%lld}",
              x.c_str(),
              ts_ms
            );

            if (mqtt::global_mqtt_client != nullptr) {
              mqtt::global_mqtt_client->publish(full_topic, payload);
            } else {
              ESP_LOGE("custom_mqtt", "MQTT client not initialized!");
            }