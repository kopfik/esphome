## components/sensors/max17048.yaml
#
# Inline:
#   max17048: !include { file: components/sensors/max17048.yaml, vars: { id: bat, update_interval: 30, window_size: 2 } }
#
# Block:
#   max17048: !include
#     file: components/sensors/max17048.yaml
#     vars:
#       id: bat
#       update_interval: 30
#       window_size: 2
#       i2c_id: i2c_bus        # volitelne (default i2c_bus)
#
# LiPo fuel gauge (napětí + SOC bez shunt rezistoru), I2C adresa fixní 0x36.
#
# Adresa se NEDA zmenit -- cip nema adresni piny ani propojku. Dva moduly na
# jedne sbernici proto nejdou; kazdy musi na vlastni I2C (viz hlavicka
# components/buses/i2c.yaml) a vybere se pres var i2c_id.
#
# ESPHome nemá vlastní platformu pro MAX17048, ale 'max17043' čte stejné
# registry (VCELL 0x02, SOC 0x04) a její přepočet 1.25mV*(raw>>4) dává pro
# MAX17048 (LSB 78.125uV) číselně identické napětí -- 1.25/16 = 0.078125 mV.
# Rozdíl je jen ve ztrátě spodních 4 bitů, tj. rozlišení 1.25 mV místo 78 uV.
# SOC má obě čipové řady ve stejném formátu (high byte %, low byte 1/256 %).
#
# POZOR: cip nema samostatny napajeci pin -- napaji se z tehoz vyvodu, kterym
# meri clanek. Klony maji na rubu propojku VS (VDD / Bat), ktera vybira zdroj:
#   VS = Bat  -> cip zije z baterie na JST a meri ji (tohle chces)
#   VS = VDD  -> cip zije z VIN a meri VIN, tedy 3.3 V misto clanku
#
# Dusledek: s VS na Bat a ODPOJENOU baterii cip NEODPOVIDA po I2C a scan ho
# vubec nenajde -- senzory zustanou NaN. Zelena LED na modulu pritom sviti dal,
# protoze visi na VIN pres vlastni odpor, takze podle ni se poznat neda.
# (Overeno 30.8.2026: dva ruzne moduly, oba "neviditelne", dokud nebyl
# pripojen clanek; SHT45 na tychz vodicich se hlasil normalne.)
#
# VIN napajej z 3V3 MCU -- I2C pull-upy na desce jsou pak na 3.3 V.

sensor:

  # ==========================================================
  # --- 1. RAW SENZORY (Internal, sypou data s TS do MQTT) ---
  # ==========================================================

  - platform: max17043
    i2c_id: ${i2c_id | default("i2c_bus")}
    update_interval: ${update_interval}s
    battery_voltage:
      id: ${id}_voltage_raw
      internal: true
      on_value:
        then:
          - script.execute: { id: mqtt_publish_json, sub_topic: "${id}_voltage", value: !lambda 'return x;', decimals: 3 }
    battery_level:
      id: ${id}_capacity_raw
      internal: true
      on_value:
        then:
          - script.execute: { id: mqtt_publish_json, sub_topic: "${id}_capacity", value: !lambda 'return x;', decimals: 2 }

  # ==========================================================
  # --- 2. PRŮMĚROVANÉ SENZORY PRO HA ---
  # ==========================================================

  - platform: copy
    source_id: ${id}_voltage_raw
    name: "${id} voltage"
    unit_of_measurement: "V"
    device_class: "voltage"
    # Prazdna kategorie = entita patri mezi bezne senzory. ESPHome ma u
    # platformy max17043 natvrdo entity_category: diagnostic a 'copy' ji ze
    # zdroje dedi (inherit_property_from), takze bez tohohle radku by hlavni
    # udaje o baterii skoncily schovane v sekci Diagnostic.
    entity_category: ""
    filters:
      - sliding_window_moving_average:
          window_size: ${window_size}
          send_every: ${window_size}

  - platform: copy
    source_id: ${id}_capacity_raw
    name: "${id} capacity"
    unit_of_measurement: "%"
    device_class: "battery"
    entity_category: ""
    filters:
      - sliding_window_moving_average:
          window_size: ${window_size}
          send_every: ${window_size}
