## components/sensors/max17048.yaml
#
# Inline:
#   max17048: !include { file: components/sensors/max17048.yaml, vars: { id: bat, update_interval: 30, window_size: 2 } }
#
# Block:
#   max17048: !include
#     file: components/sensors/max17048.yaml
#     vars:
#       id: bat
#       update_interval: 30
#       window_size: 2
#
# LiPo fuel gauge (napětí + SOC bez shunt rezistoru), I2C adresa fixní 0x36.
#
# ESPHome nemá vlastní platformu pro MAX17048, ale 'max17043' čte stejné
# registry (VCELL 0x02, SOC 0x04) a její přepočet 1.25mV*(raw>>4) dává pro
# MAX17048 (LSB 78.125uV) číselně identické napětí -- 1.25/16 = 0.078125 mV.
# Rozdíl je jen ve ztrátě spodních 4 bitů, tj. rozlišení 1.25 mV místo 78 uV.
# SOC má obě čipové řady ve stejném formátu (high byte %, low byte 1/256 %).
#
# Modul má VIN (napájení logiky, 3-5 V) oddělené od CELL (měřená baterie na
# JST). Napájej VIN z 3V3 MCU -- I2C pull-upy na desce jsou pak na 3.3 V a
# gauge měří i baterii, která patří jinému obvodu. Pozor: s odpojenou baterií
# modul dál odpovídá po I2C a hlásí napětí blízko nuly, nikoli NaN.

sensor:

  # ==========================================================
  # --- 1. RAW SENZORY (Internal, sypou data s TS do MQTT) ---
  # ==========================================================

  - platform: max17043
    update_interval: ${update_interval}s
    battery_voltage:
      id: ${id}_voltage_raw
      internal: true
      on_value:
        then:
          - script.execute: { id: mqtt_publish_json, sub_topic: "${id}_voltage", value: !lambda 'return x;', decimals: 3 }
    battery_level:
      id: ${id}_capacity_raw
      internal: true
      on_value:
        then:
          - script.execute: { id: mqtt_publish_json, sub_topic: "${id}_capacity", value: !lambda 'return x;', decimals: 2 }

  # ==========================================================
  # --- 2. PRŮMĚROVANÉ SENZORY PRO HA ---
  # ==========================================================

  - platform: copy
    source_id: ${id}_voltage_raw
    name: "${id} voltage"
    unit_of_measurement: "V"
    device_class: "voltage"
    filters:
      - sliding_window_moving_average:
          window_size: ${window_size}
          send_every: ${window_size}

  - platform: copy
    source_id: ${id}_capacity_raw
    name: "${id} capacity"
    unit_of_measurement: "%"
    device_class: "battery"
    filters:
      - sliding_window_moving_average:
          window_size: ${window_size}
          send_every: ${window_size}
