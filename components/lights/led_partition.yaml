light:
  - platform: partition
    id: ${id}
    name: ${name}
    color_correct: [0.9, 0.9, 0.9]
    default_transition_length: 0.25s
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: $id
          red: 100%
          green: 76%
          blue: 55%
    segments:
      - id: ${parent_id}
        from: ${from}
        to: ${to}
