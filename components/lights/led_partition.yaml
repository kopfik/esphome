## components/lights/led_partition.yaml
#
# Inline:
#   segment1: !include { file: components/lights/led_partition.yaml, vars: { id: stul_usek1, name: "Stul - Usek 1", parent_id: led_strip, from: 0, to: 16 } }
#
# Block:
#   segment1: !include
#     file: components/lights/led_partition.yaml
#     vars:
#       id: stul_usek1
#       name: "Stul - Usek 1"
#       parent_id: led_strip
#       from: 0
#       to: 16
#
# Optional vars (defaults): default_red (100%), default_green (76%), default_blue (55%)
# - barva nastavená při prvním zapnutí (on_turn_on), dokud si HA neurčí vlastní.

light:
  - platform: partition
    id: ${id}
    name: ${name}
    color_correct: [0.9, 0.9, 0.9]
    default_transition_length: 0.25s
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: $id
          red: ${default_red | default("100%")}
          green: ${default_green | default("76%")}
          blue: ${default_blue | default("55%")}
    segments:
      - id: ${parent_id}
        from: ${from}
        to: ${to}
