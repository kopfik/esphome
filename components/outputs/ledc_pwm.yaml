## components/outputs/ledc_pwm.yaml
#
# Inline:
#   led_pwm: !include { file: components/outputs/ledc_pwm.yaml, vars: { pin: GPIO5, id: led_pwm, frequency: 500 } }
#
# Block:
#   led_pwm: !include
#     file: components/outputs/ledc_pwm.yaml
#     vars:
#       pin: GPIO5
#       id: led_pwm
#       frequency: 500
#
# 'frequency' optional (default 500), 'inverted' optional (default false).
#
# inverted: true se hodí, když výstup budí PNP tranzistor nebo P-MOSFET --
# tam znamená nula plný jas a bez inverze by šla stupnice obráceně.

output:
  - platform: ledc
    pin: ${pin} # Tvůj IRLZ44N (Hlavní LED)
    id: ${id}
    frequency: ${frequency | default (500)} Hz
    inverted: ${inverted | default("false")}
