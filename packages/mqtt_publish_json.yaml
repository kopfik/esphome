## packages/mqtt_publish_json.yaml
#
# Inline:
#   mqtt_publish_json: !include packages/mqtt_publish_json.yaml
#
# Block:
#   mqtt_publish_json: !include packages/mqtt_publish_json.yaml
#
# Requires device substitutions: topic_prefix
#
# Provides script mqtt_publish_json (JSON payload with ms timestamp).
# Depends on packages/time.yaml (id sntp_time) and an mqtt client.
#
# Tohle je JEDINY zdroj scriptu mqtt_publish_json. Vsechny senzorove komponenty
# (components/sensors/*) ho volaji, takze ho device musi natahnout vzdycky,
# kdyz ma aspon jeden senzor z tohohle repa.
#
# Historie -- proc drive existoval i packages/sensors.yaml se stejnym scriptem:
# puvodne byl script v packages/sensors.yaml spolu s teplotou jadra MCU
# (platforma internal_temperature). Ta na ESP8266 (d1mini) neexistuje, takze se
# script oddelil sem, aby ho slo pouzit i bez ni (commit ea789a9). Pozdeji se
# i teplota MCU presunula do components/sensors/internal_temperature.yaml a
# z packages/sensors.yaml zbyla presna kopie tohohle souboru. Kdo natahl oba,
# dostal 'ID mqtt_publish_json redefined'. Proto byl packages/sensors.yaml
# smazan.
#
# Migrace starsiho device YAML: v packages nahradit
#   packages/sensors.yaml  ->  packages/mqtt_publish_json.yaml
# (klic balicku, napr. 'sensors:', muze zustat libovolny, rozhoduje soubor).
# Kdo chce i teplotu MCU, prida zvlast components/sensors/internal_temperature.yaml.

script:
  - id: mqtt_publish_json
    mode: parallel
    parameters:
      sub_topic: string
      value: float
      decimals: int
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || std::isnan(value)) return;

          // AUTOMATICKÉ SLOŽENÍ TOPICU: prefix + to co pošle senzor
          std::string full_topic = std::string("${topic_prefix}/") + sub_topic;

          // snprintf misto sprintf: "%.*f" vypisuje float bez exponentu, takze
          // nesmyslne velka hodnota (napr. rozbity senzor vrati 1e30) ma desitky
          // znaku a sprintf by prepsal pamet za bufferem. snprintf ji jen orizne.
          char val_buf[20];
          snprintf(val_buf, sizeof(val_buf), "%.*f", decimals, value);
          // ts = skutecny epoch v ms (UTC) ze systemovych hodin.
          // Drive: now.timestamp * 1000 + millis() % 1000. To michalo dvoje
          // nezavisle hodiny -- millis() je uptime a jeho sekundova hranice
          // neni srovnana se sekundou SNTP, takze "milisekundy" nebyly soucasti
          // skutecneho casu a ts mohl mezi dvema vzorky skocit DOZADU. Influx pak
          // dostal body mimo poradi a pri shode measurement+tagy+ts hodnotu tise
          // prepsal. gettimeofday() cte stejne systemove hodiny jako
          // sntp_time.now() (ten vola time()), jen i se zlomkem sekundy.
          // Pozn.: pri kazde synchronizaci SNTP se hodiny srovnaji skokem, takze
          // o par ms dozadu to jde i ted -- ale jen v okamziku synchronizace,
          // ne nahodne mezi vzorky. Pokud by nejaka platforma zlomek sekundy
          // ze SNTP nenastavovala, bude tv_usec jen rovnomerne ubihat od
          // posledni synchronizace -- porad spravny cas, jen bez vyssi presnosti.
          struct timeval tv;
          gettimeofday(&tv, nullptr);
          int64_t ts_ms = (int64_t)tv.tv_sec * 1000LL + (int64_t)(tv.tv_usec / 1000);

          char payload[128];
          snprintf(payload, sizeof(payload), "{\"value\":%s,\"ts\":%lld}", val_buf, ts_ms);

          // Publikujeme na složený topic
          if (mqtt::global_mqtt_client != nullptr) {
            mqtt::global_mqtt_client->publish(full_topic, payload);
          } else {
            ESP_LOGE("custom_mqtt", "MQTT client not initialized!");
          }
