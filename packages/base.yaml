## packages/base.yaml
#
# Inline:
#   base: !include packages/base.yaml
#
# Block:
#   base: !include packages/base.yaml
#
# Requires device substitutions: controller_name, encryption_key, wifi_ssid, wifi_password, wifi_power_saver
#
# Optional substitutions: wifi_auth_mode (default WPA2), wifi_hidden (default false).
# encryption_key / wifi_* are personalized -> come from device substitutions / secrets, never hard-code here.
#
# WiFi is a 'networks:' list (not plain ssid/password) so a device YAML can add
# a fallback network by defining its own 'wifi: networks: [...]' after this
# package -- ESPHome concatenates 'networks:' lists across packages/main config.
# (ssid/password and networks: are mutually exclusive in ESPHome, so this
# package must not use the plain ssid/password form.)
#
# wifi_hidden: "true" for an SSID that does not broadcast. ESPHome only tries a
# hidden network *before* scanning (phase EXPLICIT_HIDDEN) when it is FIRST in
# the merged 'networks:' list -- see wifi_component.cpp, start_initial_connection_():
# `if (!this->sta_.empty() && this->sta_[0].get_hidden())`. This package's network
# is always index 0, so the hidden SSID belongs here (in wifi_ssid), not in the
# device's own 'networks:' list. Marked hidden further down the list falls back to
# the RETRY_HIDDEN phase, where a preceding out-of-range network can abort the
# blind connect attempt (its late disconnect callback triggers 'Restarting adapter')
# and the device then never associates at all.

esphome:
  name: ${controller_name}
  friendly_name: ${controller_name}

ota:
  - platform: esphome

# api reboot_timeout defaults to 15min, meaning "reboot if NO API client has
# connected for 15 minutes". A device that is not added to Home Assistant as an
# ESPHome integration (i.e. runs over MQTT only) therefore reboots over and over
# -- log shows [E][api:152]: No clients; rebooting. Neither MQTT nor WiFi resets
# that timer, only API connections do. On a clock device it looks like a display
# fault: after the reboot the clock is back at 1970, time.is_valid() is false and
# the lambda draws nothing until SNTP answers.
api:
  encryption:
    key: ${encryption_key}
  reboot_timeout: 0s

wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      hidden: ${wifi_hidden | default("false")}
  min_auth_mode: ${wifi_auth_mode | default("WPA2")}
  power_save_mode: ${wifi_power_saver}
