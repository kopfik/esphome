## packages/base.yaml
#
# Inline:
#   base: !include packages/base.yaml
#
# Block:
#   base: !include packages/base.yaml
#
# Requires device substitutions: controller_name, encryption_key, wifi_ssid, wifi_password, wifi_power_saver
#
# Optional substitution: wifi_auth_mode (default WPA2).
# encryption_key / wifi_* are personalized -> come from device substitutions / secrets, never hard-code here.

esphome:
  name: ${controller_name}
  friendly_name: ${controller_name}

ota:
  - platform: esphome

api:
  encryption:
    key: ${encryption_key}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  min_auth_mode: ${wifi_auth_mode | default("WPA2")}
  power_save_mode: ${wifi_power_saver}
