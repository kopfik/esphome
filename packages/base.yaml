## packages/base.yaml
#
# Inline:
#   base: !include packages/base.yaml
#
# Block:
#   base: !include packages/base.yaml
#
# Requires device substitutions: controller_name, encryption_key, wifi_ssid, wifi_password
#
# Optional substitutions: wifi_auth_mode (default WPA2), wifi_hidden (default false),
# wifi_fast_connect (default false), wifi_power_saver (default light),
# api_max_connections (default 10, na ESP8266 predat 4 -- viz komentar u api:).
#
# wifi_power_saver: default "light" odpovida tomu, co ESPHome sam pouziva na
# ESP32 a RP2040 (wifi/__init__.py, cv.SplitDefault: esp32="light", rp2="light").
# POZOR, na ESP8266 (d1mini) ma ESPHome sam default "none" -- tam ho predej
# explicitne ("none"), jinak se chovani lisi od holeho ESPHome. Balicek neumi
# klic 'power_save_mode' vynechat (substituce ho vzdycky vyplni), proto nejde
# nechat default na ESPHome podle platformy. Hodnoty: none / light / high.
# Drive byl tenhle var povinny jako jediny z wifi_*.
# encryption_key / wifi_* are personalized -> come from device substitutions / secrets, never hard-code here.
#
# WiFi is a 'networks:' list (not plain ssid/password) so a device YAML can add
# a fallback network by defining its own 'wifi: networks: [...]' after this
# package -- ESPHome concatenates 'networks:' lists across packages/main config.
# (ssid/password and networks: are mutually exclusive in ESPHome, so this
# package must not use the plain ssid/password form.)
#
# wifi_hidden: "true" for an SSID that does not broadcast. ESPHome only tries a
# hidden network *before* scanning (phase EXPLICIT_HIDDEN) when it is FIRST in
# the merged 'networks:' list -- see wifi_component.cpp, start_initial_connection_():
# `if (!this->sta_.empty() && this->sta_[0].get_hidden())`. This package's network
# is always index 0, so the hidden SSID belongs here (in wifi_ssid), not in the
# device's own 'networks:' list. Marked hidden further down the list falls back to
# the RETRY_HIDDEN phase, where a preceding out-of-range network can abort the
# blind connect attempt (its late disconnect callback triggers 'Restarting adapter')
# and the device then never associates at all.
#
# wifi_fast_connect: "true" makes ESPHome store BSSID + channel after the first
# successful association and reconnect straight to them on later boots, skipping
# the scan entirely (phase INITIAL_CONNECT). Worth it on a hidden SSID, where the
# first directed probe often goes unanswered and the device burns a scan plus a
# failed attempt before it associates. Left off by default: it pins the device to
# one BSSID, which is not what you want on a roaming/mesh SSID. ESPHome falls back
# to the normal flow when the saved AP is gone.

esphome:
  name: ${controller_name}
  friendly_name: ${controller_name}

ota:
  - platform: esphome

# api reboot_timeout defaults to 15min, meaning "reboot if NO API client has
# connected for 15 minutes". A device that is not added to Home Assistant as an
# ESPHome integration (i.e. runs over MQTT only) therefore reboots over and over
# -- log shows [E][api:152]: No clients; rebooting. Neither MQTT nor WiFi resets
# that timer, only API connections do. On a clock device it looks like a display
# fault: after the reboot the clock is back at 1970, time.is_valid() is false and
# the lambda draws nothing until SNTP answers.
api:
  encryption:
    key: ${encryption_key}
  reboot_timeout: 0s
  # Default ESPHome je 5 na ESP32 a 4 na ESP8266 / RP2040 (api/__init__.py,
  # cv.SplitDefault) a to dojde driv, nez by clovek cekal: HA drzi jedno
  # spojeni trvale, kazde 'esphome logs' pres API si vezme dalsi a
  # nekorektne ukoncena relace slot chvili drzi. Kdyz je limit vycerpany,
  # deska odmita i HA ("Max connections (5), rejecting ...") a vsechno,
  # co jede pres API -- vcetne voice_assistant -- tise prestane fungovat.
  # 10 je pohodlna rezerva; vic nema smysl, sockety jsou sdileny pool
  # s MQTT/OTA/mDNS a kazde spojeni si drzi vlastni buffery.
  # Je to jen horni limit -- ESPHome podle nej sockety predem nerezervuje
  # (pocita s 3 klienty), pamet se bere az pri skutecnem spojeni.
  # POZOR ESP8266 (d1mini): ma jen desitky kB volne RAM, 10 soucasnych API
  # spojeni by ji mohlo vycerpat. Tam predej api_max_connections: 4
  # (default ESPHome). Volitelny var api_max_connections, rozsah 1..20.
  max_connections: ${api_max_connections | default(10)}

wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      hidden: ${wifi_hidden | default("false")}
  min_auth_mode: ${wifi_auth_mode | default("WPA2")}
  power_save_mode: ${wifi_power_saver | default("light")}
  fast_connect: ${wifi_fast_connect | default("false")}
