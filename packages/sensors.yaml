## packages/sensors.yaml
#
# Inline:
#   sensors: !include packages/sensors.yaml
#
# Block:
#   sensors: !include packages/sensors.yaml
#
# Requires device substitutions: topic_prefix
#
# Poskytuje script mqtt_publish_json -- spolecny zapis hodnoty s timestampem
# do MQTT, ktery pouzivaji vsechny senzorove komponenty v tomhle repu.
# Zavisi na packages/time.yaml (id sntp_time) a na mqtt klientovi.
#
# Samotna teplota MCU uz tady NENI -- presunuta do
# components/sensors/internal_temperature.yaml, aby byla v device YAML videt
# a sla vypnout. Tenhle soubor je ciste infrastruktura, i kdyz mu nazev
# "sensors" zustal (prejmenovani by rozbilo vsechny existujici device YAML).

script:
  - id: mqtt_publish_json
    mode: parallel
    parameters:
      sub_topic: string
      value: float
      decimals: int
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || std::isnan(value)) return;

          // AUTOMATICKÉ SLOŽENÍ TOPICU: prefix + to co pošle senzor
          std::string full_topic = std::string("${topic_prefix}/") + sub_topic;

          char val_buf[20];
          sprintf(val_buf, "%.*f", decimals, value);
          int64_t ts_ms = (int64_t)now.timestamp * 1000LL + (int64_t)(millis() % 1000);
          
          char payload[128];
          sprintf(payload, "{\"value\":%s,\"ts\":%lld}", val_buf, ts_ms);
          
          // Publikujeme na složený topic
          if (mqtt::global_mqtt_client != nullptr) {
            mqtt::global_mqtt_client->publish(full_topic, payload);
          } else {
            ESP_LOGE("custom_mqtt", "MQTT client not initialized!");
          }
