## packages/sensors.yaml
#
# Inline:
#   sensors: !include packages/sensors.yaml
#
# Block:
#   sensors: !include packages/sensors.yaml
#
# Requires device substitutions: topic_prefix
#
# Provides script mqtt_publish_json + an internal_temperature sensor.
# Depends on packages/time.yaml (id sntp_time) and an mqtt client.

script:
  - id: mqtt_publish_json
    mode: parallel
    parameters:
      sub_topic: string
      value: float
      decimals: int
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || std::isnan(value)) return;

          // AUTOMATICKÉ SLOŽENÍ TOPICU: prefix + to co pošle senzor
          std::string full_topic = std::string("${topic_prefix}/") + sub_topic;

          char val_buf[20];
          sprintf(val_buf, "%.*f", decimals, value);
          int64_t ts_ms = (int64_t)now.timestamp * 1000LL + (int64_t)(millis() % 1000);
          
          char payload[128];
          sprintf(payload, "{\"value\":%s,\"ts\":%lld}", val_buf, ts_ms);
          
          // Publikujeme na složený topic
          if (mqtt::global_mqtt_client != nullptr) {
            mqtt::global_mqtt_client->publish(full_topic, payload);
          } else {
            ESP_LOGE("custom_mqtt", "MQTT client not initialized!");
          }
sensor:
  # ==========================================================
  # --- 1. RAW SENZORY (Internal, sypou vteřinová data do MQTT) ---
  # ==========================================================

  - platform: internal_temperature
    id: raw_internal_temp
    internal: true
    force_update: True
    update_interval: 15s
    on_value:
      then: 
        - script.execute: { id: mqtt_publish_json, sub_topic: "internal_temperature", value: !lambda 'return x;', decimals: 1 }

  # ==========================================================
  # --- 2. PRŮMĚROVANÉ SENZORY PRO HA (Stávající logika) ---
  # ==========================================================

  - platform: copy
    source_id: raw_internal_temp
    name: "internal_temperature"
    filters:
      - sliding_window_moving_average: {window_size: 4, send_every: 4}
