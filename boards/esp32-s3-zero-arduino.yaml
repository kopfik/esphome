## boards/esp32-s3-zero-arduino.yaml
#
# Inline:
#   board: !include boards/esp32-s3-zero-arduino.yaml
#
# Block:
#   board: !include boards/esp32-s3-zero-arduino.yaml
#
# Requires device substitutions: cpu_freq
# Optional substitutions: flash_size (default 4MB)
#
# Uses the arduino framework variant (vs esp-idf on the other s3 boards).
#
# flash_size: Waveshare ESP32-S3-Zero ma ESP32-S3-FH4R2, tedy 4 MB flash
# a 2 MB PSRAM -- proto ten default. Varianta N8R8 (modul ESP32-S3R8) ma
# 8 MB flash a 8 MB octal PSRAM a musi si `flash_size: 8MB` predat sama.
# Musi to sedet s realnym cipem -- vetsi cislo nez ma deska znamena, ze
# partition tabulka ukazuje za konec flash a kus se po flashnuti nerozjede.

esp32:
  board: esp32-s3-devkitc-1
#  variant: esp32s3
  flash_size: ${flash_size | default("4MB")}
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_ESP32_S3_DATA_CACHE_64KB: y
  cpu_frequency: ${cpu_freq}Mhz

