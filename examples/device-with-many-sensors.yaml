## examples/device-with-many-sensors.yaml
#
# Larger example of a PRIVATE device YAML with a full sensor stack (I2C bus, RGB
# LED, SHT4x, BMP3xx, two BMP58x instances, SCD4x, SGP4x). It lives in your Home
# Assistant / site repo, NOT in this public repo, and pulls reusable packages
# from this PUBLIC repo via ESPHome's remote (git) packages.
#
# How to use:
#   1. Copy this file into your private HA esphome directory and rename it.
#   2. Keep all real values (Wi-Fi, API key, MQTT) in your local secrets.yaml.
#   3. While testing, `ref: master` is fine; pin a tag/commit for stable builds.
#
# Notes on the structure (this is what actually works):
#   - The shared remote source (url / ref / refresh) is defined ONCE as a YAML
#     anchor (&kopfik_esphome_remote) on the first package and reused on the
#     others via `<<: *kopfik_esphome_remote`. This is plain YAML syntax, purely
#     for readability — each package still resolves to its own remote source.
#   - `files:` stays per package; `vars:` MUST be nested under the file item
#     (next to `path:`), NOT directly under the package key.
#   - The same file can be pulled under different keys with different vars to get
#     multiple instances (see bmp581 / bmp585 below, both from bmp58x_custom).
#   - Secrets are resolved HERE (device level). ESPHome cannot resolve `!secret`
#     inside the pulled package files, so pass values in via vars / substitutions.

# --- device specific substitutions
substitutions:
  controller_name: "example-device"
  topic_prefix: "esphome/site/example-device"
  cpu_freq: "240"
  wifi_power_saver: light
  # secrets resolved locally from your secrets.yaml (placeholder names)
  encryption_key: !secret api_encryption_key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  i2c_bus_id: i2c_bus

# --- device specific configuration
esphome:

# --- logging
logger:
  level: INFO

packages:
  ## --- base
  # First entry defines the shared remote source as an anchor; the rest reuse it.
  base: &kopfik_esphome_remote
    url: https://github.com/kopfik/esphome
    ref: master            # while testing; pin a tag/commit for stable builds
    refresh: 1d
    files:
      - packages/base.yaml
  board:
    <<: *kopfik_esphome_remote
    files:
      - boards/esp32-s3-supermini-esp-idf.yaml
  pwr_mgmt:
    <<: *kopfik_esphome_remote
    files:
      - boards/esp32_powersave.yaml
  time:
    <<: *kopfik_esphome_remote
    files:
      - path: packages/time.yaml
        vars:
          sntp_server: pool.ntp.org
  mqtt:
    <<: *kopfik_esphome_remote
    files:
      - path: packages/mqtt.yaml
        vars:
          id: !secret mqtt_id
          broker: !secret mqtt_broker
          port: !secret mqtt_port

  ## --- onboard HW + buses
  sensors:
    <<: *kopfik_esphome_remote
    files:
      - packages/sensors.yaml
  i2c_bus:
    <<: *kopfik_esphome_remote
    files:
      - path: components/buses/i2c.yaml
        vars:
          id: "${i2c_bus_id}"
          sda: GPIO13
          scl: GPIO12
          scan: true
          frequency: 400
  rgb_led:
    <<: *kopfik_esphome_remote
    files:
      - path: components/lights/esp32_rmt_rgb_led.yaml
        vars:
          name: "RGB led"
          pin: GPIO38
          rgb_order: grb

  ## --- connected external sensors
  sht45:
    <<: *kopfik_esphome_remote
    files:
      - path: components/sensors/sht4x.yaml
        vars:
          id: sht45
          address: 0x44
          update_interval: 1
          window_size: 60
  bmp390l:
    <<: *kopfik_esphome_remote
    files:
      - path: components/sensors/bmp3xx_i2c.yaml
        vars:
          id: bmp390l
          address: 0x77
          update_interval: 1
          window_size: 60
          press_offset: 0
  # same file, different key + vars -> a second BMP58x instance
  bmp581:
    <<: *kopfik_esphome_remote
    files:
      - path: components/sensors/bmp58x_custom.yaml
        vars:
          id: bmp581
          address: 0x47
          press_update_interval: 1
          temp_update_interval: 1
          press_window_size: 60
          temp_window_size: 60
          press_offset: 0
  bmp585:
    <<: *kopfik_esphome_remote
    files:
      - path: components/sensors/bmp58x_custom.yaml
        vars:
          id: bmp585
          address: 0x46
          press_update_interval: 1
          temp_update_interval: 1
          press_window_size: 60
          temp_window_size: 60
          press_offset: 0
  # cross-reference: pressure compensation source from another sensor's raw id
  scd41:
    <<: *kopfik_esphome_remote
    files:
      - path: components/sensors/scd4x.yaml
        vars:
          id: scd41
          address: 0x62
          update_interval: 30
          window_size: 2
          measurement_mode: LOW_POWER_PERIODIC
          press_compensation_src: bmp585_press_raw
          calibration_ppm: 435  # optional (default 435) — target CO2 for the forced calibration button
  sgp41:
    <<: *kopfik_esphome_remote
    files:
      - path: components/sensors/sgp4x.yaml
        vars:
          id: sgp41
          address: 0x59
          update_interval: 2
          window_size: 30
          temp_compensation_src: sht45_temp_raw
          hum_compensation_src: sht45_hum_raw
