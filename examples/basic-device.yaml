## examples/basic-device.yaml
#
# Example of a PRIVATE device YAML (lives in your Home Assistant / site repo,
# NOT in this public repo) that pulls reusable packages from this PUBLIC repo
# via ESPHome's remote (git) packages.
#
# How to use:
#   1. Copy this file into your private HA esphome directory and rename it.
#   2. Replace <your-user>/<your-public-repo> with this repo's URL.
#   3. Keep all real values (Wi-Fi, API key, MQTT) in your local secrets.yaml.
#   4. Pin `ref:` to a tag/commit for reproducible builds.
#
# Note: ESPHome remote packages cannot resolve `!secret` inside the package
# files themselves. Resolve secrets here at the device level (substitutions)
# and let the packages read them via ${...}.

substitutions:
  controller_name: "example-device"
  topic_prefix: "esphome/site/example-device"
  cpu_freq: "240"
  wifi_power_saver: light
  # secrets resolved locally, consumed by packages via ${...}
  encryption_key: !secret api_encryption_key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  mqtt_broker: !secret mqtt_broker
  i2c_bus_id: i2c_bus

esphome:

logger:
  level: INFO

packages:
  shared:
    url: https://github.com/<your-user>/<your-public-repo>
    ref: main                # pin to a tag/commit for reproducible builds
    refresh: 1d
    files:
      # --- base
      - path: packages/base.yaml
      - path: boards/esp32-s3-supermini-esp-idf.yaml
      - path: boards/esp32_powersave.yaml
      - path: packages/time.yaml
        vars: { sntp_server: pool.ntp.org }
      - path: packages/mqtt.yaml
        vars: { id: mqtt_client, broker: "${mqtt_broker}", port: "1883" }

      # --- onboard HW + buses
      - path: packages/sensors.yaml
      - path: components/buses/i2c.yaml
        vars: { id: "${i2c_bus_id}", sda: GPIO6, scl: GPIO7, scan: "true", frequency: "400" }

      # --- connected external sensors
      # (same file can be listed multiple times with different vars -> multiple instances)
      - path: components/sensors/sht4x.yaml
        vars: { id: sht40, address: "0x44", update_interval: "1", window_size: "60" }
