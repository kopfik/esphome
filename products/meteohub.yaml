      - "\U000F058E"   # water-percent
      - "\U000F07E4"   # molecule-co2
      - "\U000F029A"   # gauge
      - "\U000F01F7"   # emoticon-poop (VOC)
      - "\U000F020F"   # factory (NOx)
      - "\U000F05A8"   # white-balance-sunny
      - "\U000F09D2"   # calendar-heart


# Petynka SSID nebroadcastuje, takze musi byt PRVNI v seslepenem 'networks:'
# a mit hidden: true -- jen tak ji ESPHome zkusi pred skenem (faze EXPLICIT_HIDDEN,
# wifi_component.cpp: `if (!this->sta_.empty() && this->sta_[0].get_hidden())`).
# Index 0 dodava base.yaml, proto petynka jede pres substituce wifi_ssid/wifi_hidden
# nahore a milavce se pripoji az sem jako druha.
#
# Kdyz to bylo naopak, milavce se zkousela prvni, spadla na 'Probe Request
# Unsuccessful' a jeji opozdeny disconnect callback ustrelil tri sekundy dlouhy
# slepy pokus o petynku -> 'Restarting adapter' a dokola.
