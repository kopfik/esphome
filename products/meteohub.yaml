  # Grafy 25 hodin
  - id: graph_temp_25h
    duration: 25h
    width: 300
    height: 176
    x_grid: 5h
    y_grid: 1.0
    min_value: 20
    max_value: 27
    border: true
    traces:
      - sensor: ha_temperature
        line_type: SOLID
        line_thickness: 2
        color: color_orange_1

  - id: graph_humidity_25h
    duration: 25h
    width: 300
    height: 176
    x_grid: 5h
    y_grid: 10.0
    min_value: 20
    max_value: 65
    border: true
    traces:
      - sensor: ha_humidity
        line_type: SOLID
        line_thickness: 2
        color: color_green_1

  - id: graph_co2_25h
    duration: 25h
    width: 300
    height: 176
    x_grid: 5h
    y_grid: 300.0
    min_value: 500
    max_value: 2000
    border: true
    traces:
      - sensor: ha_co2
        line_type: SOLID
        line_thickness: 2
        color: color_green_0

  - id: graph_voc_25h
    duration: 25h
    width: 300
    height: 176
    x_grid: 5h
    y_grid: 50.0
    border: true
    traces:
      - sensor: ha_voc
        line_type: SOLID
        line_thickness: 2
        color: color_purple

  - id: graph_nox_25h
    duration: 25h
    width: 300
    height: 176
    x_grid: 5h
    y_grid: 50.0
    border: true
    traces:
      - sensor: ha_nox
        line_type: SOLID
        line_thickness: 2
        color: color_orange_2

  - id: graph_lux_25h
    duration: 25h
    width: 300
    height: 176
    x_grid: 5h
    y_grid: 100.0
    border: true
    traces:
      - sensor: ha_lux
        line_type: SOLID
        line_thickness: 2
        color: color_yellow

select:
  - platform: template
    name: "Barevne schema"
    id: barevne_schema
    optimistic: true
    restore_value: true
    options:
      - "Arch modrá"
      - "Zelená"
      - "Jantar"
      - "Žhavá"
    initial_option: "Arch modrá"
    set_action:
      - lambda: |-
          if (x == "Arch modrá") {
            id(paleta) = 0;
          } else if (x == "Zelená") {
            id(paleta) = 1;
          } else if (x == "Jantar") {
            id(paleta) = 2;
          } else if (x == "Žhavá") {
            id(paleta) = 3;
          }
      - script.execute: apply_palette
      - component.update: ${display_id | default("displej35")}

  - platform: template
    name: "${page_select_name}"
    id: display_page
    optimistic: true
    options:
      - "Dashboard"
      - "Grafy - Teplota"
      - "Grafy - Vlhkost"
      - "Grafy - CO2"
      - "Grafy - VOC"
      - "Grafy - NOx"
      - "Grafy - Svetlo"
      - "Svátky"
      - "Foto - Brocek"
    initial_option: "Dashboard"
    set_action:
      - lambda: |-
          if (x == "Dashboard") {
            id(${display_id | default("displej35")}).show_page(id(page_dashboard));
          } else if (x == "Grafy - Teplota") {
            id(${display_id | default("displej35")}).show_page(id(page_graphs_temp));
          } else if (x == "Grafy - Vlhkost") {
            id(${display_id | default("displej35")}).show_page(id(page_graphs_humidity));
          } else if (x == "Grafy - CO2") {
            id(${display_id | default("displej35")}).show_page(id(page_graphs_co2));
          } else if (x == "Grafy - VOC") {
            id(${display_id | default("displej35")}).show_page(id(page_graphs_voc));
          } else if (x == "Grafy - NOx") {
            id(${display_id | default("displej35")}).show_page(id(page_graphs_nox));
          } else if (x == "Grafy - Svetlo") {
            id(${display_id | default("displej35")}).show_page(id(page_graphs_lux));
          } else if (x == "Svátky") {
            id(${display_id | default("displej35")}).show_page(id(page_svatky));
          } else if (x == "Foto - Brocek") {
            id(${display_id | default("displej35")}).show_page(id(page_photos));
          }
          id(${display_id | default("displej35")}).update();

button:
  - platform: template
    name: "Stranka dalsi"
    id: btn_page_next
    on_press:
      - display.page.show_next: ${display_id | default("displej35")}
      - component.update: ${display_id | default("displej35")}

  - platform: template
    name: "Stranka predchozi"
    id: btn_page_prev
    on_press:
      - display.page.show_previous: ${display_id | default("displej35")}
      - component.update: ${display_id | default("displej35")}

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              auto time = id(${time_id | default("sntp_time")}).now();
              return time.is_valid() && time.second == 0;
          then:
            - component.update: ${display_id | default("displej35")}

display:
  - id: !extend ${display_id | default("displej35")}
    pages:
      - id: page_dashboard
        lambda: |-
          it.fill(id(color_bg));

          // ---- Barevne prahy (zachovano) ----
          auto color_co2 = [&](float value) -> Color {
            if (isnan(value)) return id(color_muted);
            if (value >= 1800) return id(color_red);
            if (value >= 1650) return id(color_orange_3);
            if (value >= 1500) return id(color_orange_2);
            if (value >= 1350) return id(color_orange_1);
            if (value >= 1200) return id(color_yellow);
            if (value >= 1050) return id(color_green_3);
            if (value >= 900)  return id(color_green_2);
            if (value >= 750)  return id(color_green_1);
            return id(color_green_0);
          };

          // Prahy tlaku jsou vazane na konkretni cidlo a nadmorskou vysku, proto
          // se stred bere z varu press_center a prahy se od nej odvijeji po 4 hPa.
          const float PC = ${press_center};
          auto color_pressure = [&](float value) -> Color {
            if (isnan(value)) return id(color_muted);
            if (value >= PC + 32) return id(color_red);
            if (value >= PC + 28) return id(color_orange_3);
            if (value >= PC + 24) return id(color_orange_2);
            if (value >= PC + 20) return id(color_orange_1);
            if (value >= PC + 16) return id(color_yellow);
            if (value >= PC + 12) return id(color_green_3);
            if (value >= PC +  8) return id(color_green_2);
            if (value >= PC +  4) return id(color_green_1);
            if (value >= PC     ) return id(color_green_0);
            if (value >= PC -  4) return id(color_green_1);
            if (value >= PC -  8) return id(color_green_2);
            if (value >= PC - 12) return id(color_green_3);
            if (value >= PC - 16) return id(color_yellow);
            if (value >= PC - 20) return id(color_orange_1);
            if (value >= PC - 24) return id(color_orange_2);
            if (value >= PC - 28) return id(color_orange_3);
            return id(color_red);
          };

          auto color_humidity = [&](float value) -> Color {
            if (isnan(value)) return id(color_muted);
            if (value >= 74) return id(color_red);
            if (value >= 71) return id(color_orange_3);
            if (value >= 68) return id(color_orange_2);
            if (value >= 65) return id(color_orange_1);
            if (value >= 62) return id(color_yellow);
            if (value >= 59) return id(color_green_3);
            if (value >= 56) return id(color_green_2);
            if (value >= 53) return id(color_green_1);
            if (value >= 50) return id(color_green_0);
            if (value >= 47) return id(color_green_1);
            if (value >= 44) return id(color_green_2);
            if (value >= 41) return id(color_green_3);
            if (value >= 38) return id(color_yellow);
            if (value >= 35) return id(color_orange_1);
            if (value >= 32) return id(color_orange_2);
            if (value >= 29) return id(color_orange_3);
            return id(color_red);
          };

          auto color_temperature = [&](float value) -> Color {
            if (isnan(value)) return id(color_muted);
            if (value >= 29) return id(color_red);
            if (value >= 28) return id(color_orange_3);
            if (value >= 27) return id(color_orange_2);
            if (value >= 26) return id(color_orange_1);
            if (value >= 25) return id(color_yellow);
            if (value >= 24) return id(color_green_3);
            if (value >= 23) return id(color_green_2);
            if (value >= 22) return id(color_green_1);
            return id(color_green_0);
          };

          // SGP41 VOC index: 100 = dlouhodoby prumer mistnosti, min = cistsi vzduch.
          auto color_voc = [&](float value) -> Color {
            if (isnan(value)) return id(color_muted);
            if (value >= 400) return id(color_red);
            if (value >= 350) return id(color_orange_3);
            if (value >= 300) return id(color_orange_2);
            if (value >= 250) return id(color_orange_1);
            if (value >= 200) return id(color_yellow);
            if (value >= 150) return id(color_green_3);
            if (value >= 120) return id(color_green_2);
            if (value >= 100) return id(color_green_1);
            return id(color_green_0);
          };

          // SGP41 NOx index: klidovy stav sedi na 1, cokoliv vyssiho je udalost
          // (vyfuk, spalovani), proto jsou prahy dole mnohem hustsi nez u VOC.
          auto color_nox = [&](float value) -> Color {
            if (isnan(value)) return id(color_muted);
            if (value >= 300) return id(color_red);
            if (value >= 250) return id(color_orange_3);
            if (value >= 200) return id(color_orange_2);
            if (value >= 150) return id(color_orange_1);
            if (value >= 100) return id(color_yellow);
            if (value >= 50)  return id(color_green_3);
            if (value >= 20)  return id(color_green_2);
            if (value >= 10)  return id(color_green_1);
            return id(color_green_0);
          };

          // ---- Horni lista ----
          it.filled_rectangle(0, 0, 320, 34, id(color_card));
          it.print(10, 4, id(font_label), id(color_arch), TextAlign::TOP_LEFT, "${nadpis}");
          {
            auto t0 = id(${time_id | default("sntp_time")}).now();
            if (t0.is_valid()) {
              it.strftime(310, 9, id(font_small), id(color_white), TextAlign::TOP_RIGHT, "%d.%m.%Y", t0);
            } else {
              it.print(310, 9, id(font_small), id(color_muted), TextAlign::TOP_RIGHT, "cekam na cas...");
            }
          }

          // ---- Karta s ciselnou hodnotou ----
          // 4 rady bez dolni listy: Y0 40 + 4*102 + 3*8 = 472, dole zbyva 8 px.
          const int CW = 148, CH = 102, GAP = 8, X0 = 8, Y0 = 40;
          auto card = [&](int col, int row, const char *icon, const char *label, float value, const char *unit, int decimals, Color vcolor) {
            int x = X0 + col * (CW + GAP);
            int y = Y0 + row * (CH + GAP);
            it.filled_rectangle(x, y, CW, CH, id(color_card));
            it.print(x + 8, y + 26, id(font_icons), vcolor, TextAlign::TOP_LEFT, icon);
            it.print(x + CW - 12, y + 8, id(font_small), id(color_muted), TextAlign::TOP_RIGHT, label);
            if (isnan(value)) {
              it.print(x + CW - 12, y + 34, id(font_value), id(color_muted), TextAlign::TOP_RIGHT, "--");
            } else if (decimals == 0) {
              it.printf(x + CW - 12, y + 34, id(font_value), vcolor, TextAlign::TOP_RIGHT, "%.0f", value);
            } else {
              it.printf(x + CW - 12, y + 34, id(font_value), vcolor, TextAlign::TOP_RIGHT, "%.1f", value);
            }
            it.print(x + CW - 12, y + 76, id(font_small), id(color_muted), TextAlign::TOP_RIGHT, unit);
            it.filled_rectangle(x + CW - 6, y + 8, 3, CH - 16, isnan(value) ? id(color_grid) : vcolor);
          };

          card(0, 0, "\U000F050F", "Teplota", id(ha_temperature).state, "°C",  1, color_temperature(id(ha_temperature).state));
          card(1, 0, "\U000F058E", "Vlhkost", id(ha_humidity).state,    "%",   0, color_humidity(id(ha_humidity).state));
          card(0, 1, "\U000F07E4", "CO2",     id(ha_co2).state,         "ppm", 0, color_co2(id(ha_co2).state));
          card(1, 1, "\U000F029A", "Tlak",    id(ha_pressure).state,    "hPa", 0, color_pressure(id(ha_pressure).state));
          card(0, 2, "\U000F01F7", "VOC",     id(ha_voc).state,         "idx", 0, color_voc(id(ha_voc).state));
          card(1, 2, "\U000F020F", "NOx",     id(ha_nox).state,         "idx", 0, color_nox(id(ha_nox).state));
