      - id: page_svatky
        lambda: |-
          it.fill(id(color_bg));
          it.rectangle(0, 0, 319, 479, id(color_card));

          it.print(160, 16, id(font_title), id(color_arch), TextAlign::TOP_CENTER, "Svátky");
          it.line(16, 62, 304, 62, id(color_card));

          // strftime("%A") by dal anglicke dny (locale C), takze mala tabulka.
          // ESPTime.day_of_week je 1 = nedele.
          static const char *const DNY[8] = {"", "neděle", "pondělí", "úterý",
                                              "středa", "čtvrtek", "pátek", "sobota"};
          const int Y[7] = {88, 142, 196, 250, 310, 364, 418};
          text_sensor::TextSensor *JMENA[7] = {
            id(ha_svatek_m3), id(ha_svatek_m2), id(ha_svatek_m1), id(ha_svatek_dnes),
            id(ha_svatek_p1), id(ha_svatek_p2), id(ha_svatek_p3),
          };

          auto ted = id(${time_id | default("sntp_time")}).now();
          // Datum se pocita z mistniho poledne, ne z aktualniho casu -- pricitani
          // 86400 s pres prechod letniho casu by jinak u pulnoci preskocilo den.
          int32_t poledne = 0;
          if (ted.is_valid()) {
            poledne = (int32_t) ted.timestamp
                      - (ted.hour * 3600 + ted.minute * 60 + ted.second) + 43200;
          }

          for (int i = 0; i < 7; i++) {
            bool dnes = (i == 3);
            const char *jmeno = JMENA[i]->has_state() ? JMENA[i]->state.c_str() : "--";
            Color c_jmeno = JMENA[i]->has_state()
                              ? (dnes ? id(color_arch) : id(color_white))
                              : id(color_muted);
            auto *f_jmeno = dnes ? id(font_label) : id(font_small);

            if (ted.is_valid()) {
              auto d = ESPTime::from_epoch_local((time_t) (poledne + (i - 3) * 86400));
              char datum[32];
              snprintf(datum, sizeof(datum), "%s %d. %d.",
                       DNY[d.day_of_week], d.day_of_month, d.month);
              // Dnesek ma jmeno ve font_label, takze nejdelsi kombinace
              // ("pondělí 22. 12." + "Cyril a Metoděj") by presahla o ~25 px.
              // V tom pripade se u prostredniho radku nazev dne vypusti.
              if (dnes) {
                int w_jm = 0, w_dat = 0, dummy = 0;
                f_jmeno->measure(jmeno, &w_jm, &dummy, &dummy, &dummy);
                id(font_small)->measure(datum, &w_dat, &dummy, &dummy, &dummy);
                if (w_dat + w_jm + 12 > 292) {
                  snprintf(datum, sizeof(datum), "%d. %d.", d.day_of_month, d.month);
                }
              }
              it.print(14, Y[i] + (dnes ? 5 : 0), id(font_small),
                       dnes ? id(color_white) : id(color_muted), TextAlign::TOP_LEFT, datum);
            }

            it.print(306, Y[i], f_jmeno, c_jmeno, TextAlign::TOP_RIGHT, jmeno);
          }

