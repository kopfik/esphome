## products/meteohub.yaml
#
# Kompletni UI vrstva meteohubu -- vse, co ma na vsech kusech vypadat a chovat
# se STEJNE: barvy, fonty, palety, grafy, stranky displeje, HA senzory, obsluha
# radaru a podsviceni. Device YAML uz resi jen zelezo (piny, sbernice) a preda
# sem par parametru.
#
# Panel je natvrdo 320x480 na vysku (ST7796). Vsechny souradnice v lambdach jsou
# na tenhle rozmer napocitane, jiny panel = jiny produkt.
#
# Inline:
#   meteohub:
#     <<: *kopfik_esphome_remote
#     files:
#       - path: products/meteohub.yaml
#         vars:
#           nadpis: METEOHUB
#           ha_senzory: sensor.nejaky_prefix
#           press_center: "965"
#           foto_id: img_brocek
#           page_select_name: Meteohub display page
#
# Vars:
#   nadpis            text v zahlavi dashboardu (napr. METEOHUB)
#   ha_senzory        prefix entit v HA, ze kterych se ctou hodnoty. Opsat z HA,
#                     NEodvozovat z controller_name -- HA si pred nej pridava svoje.
#                     Suffixy (_temperature_sht45, _co2_scd41, ...) dodavaji balicky
#                     sht4x / bmp58x_custom / scd4x / sgp4x / opt3001.
#   press_center      stred prahove skaly tlaku v hPa. Vazany na konkretni cidlo
#                     a nadmorskou vysku, ne na vzhled -- proto parametr.
#                     Prahy jdou po 4 hPa od stredu na obe strany.
#   foto_id           id obrazku pro posledni stranku (device si ho definuje sam,
#                     protoze soubor lezi v jeho media/)
#   display_id        id displeje k rozsireni (default displej35)
#   time_id           id time komponenty (default sntp_time)
#   ha_svatky         prefix entit se svatky (default sensor.svatek). Balicek cte
#                     ${ha_svatky}_m3 .. _m1, _dnes, _p1 .. _p3 pro stranku Svátky.
#   page_select_name  jmeno select entity pro prepinani stranek. Meni entity_id
#                     v HA, takze u existujiciho kusu opsat to stavajici.
#
# Device MUSI pred timhle balickem definovat (jmena jsou pevna, nejsou to vars):
#   displej35 / ${display_id}   ili9xxx ST7796, dimensions 320x480
#   sntp_time / ${time_id}      packages/time.yaml
#   backlight_light             components/lights/monochromatic.yaml
#   segmentovy_displej_power    components/displays/tm1637.yaml
#   ld2410c_has_target          components/sensors/ld2410.yaml
#   ${foto_id}                  image:

esphome:
  on_boot:
    priority: -100
    then:
      # Nejdriv vykreslit (podsviceni je jeste zhasle), az potom rozsvitit -
      # jinak je na displeji zrni z neinicializovaneho bufferu.
      - script.execute: apply_palette
      - delay: 3s
      - component.update: ${display_id | default("displej35")}
      - light.turn_on:
          id: backlight_light
          brightness: 100%

globals:
  # Index barevneho schematu; drzi hodnotu pres reboot, select ho jen prepina.
  - id: paleta
    type: int
    restore_value: true
    initial_value: '0'

script:
  # Prepise dve "chromove" barvy podle vybraneho schematu. Prahove barvy
  # (green/yellow/orange/red) se nemeni schvalne - nesou vyznam. Grafove tracy
  # se sem taky netahaji, ty maji barvu pevne podle veliciny.
  - id: apply_palette
    then:
      - lambda: |-
          //                        akcent              panel
          static const uint8_t PAL[4][2][3] = {
            {{0x17, 0x93, 0xD1}, {0x14, 0x1B, 0x24}},   // 0 Arch modra
            {{0x3F, 0xB9, 0x50}, {0x10, 0x1C, 0x13}},   // 1 Zelena
            {{0xE0, 0xA0, 0x30}, {0x1E, 0x18, 0x11}},   // 2 Jantar
            {{0xE8, 0x5D, 0x04}, {0x1A, 0x0E, 0x06}},   // 3 Zhavá
          };
          int i = id(paleta);
          if (i < 0 || i > 3) i = 0;
          id(color_arch) = Color(PAL[i][0][0], PAL[i][0][1], PAL[i][0][2]);
          id(color_card) = Color(PAL[i][1][0], PAL[i][1][1], PAL[i][1][2]);

  # Zhasne az kdyz je 3 min klid; kazdy novy on_release odpocet restartuje.
  - id: backlight_off_delayed
    mode: restart
    then:
      - delay: 3min
      - light.turn_off: backlight_light
      - switch.turn_off: segmentovy_displej_power

binary_sensor:
  # Presence/moving/still + number entity pro ladeni radaru dodava package
  # ld2410c; tady se jen doveluji akce na podsviceni a sedmisegmentovku.
  # !extend na ld2410c_has_target NEJDE -- ten senzor je vnoreny v `has_target:`
  # uvnitr platformy, ne samostatna polozka seznamu. Proto kopie pres `copy`.
  - platform: copy
    source_id: ld2410c_has_target
    id: radar_presence_akce
    internal: true
    on_press:
      - script.stop: backlight_off_delayed
      - light.turn_on:
          id: backlight_light
          brightness: 100%
      - switch.turn_on: segmentovy_displej_power
    on_release:
      - script.execute: backlight_off_delayed

sensor:
  - platform: homeassistant
    id: ha_co2
    entity_id: ${ha_senzory}_co2_scd41

  - platform: homeassistant
    id: ha_humidity
    entity_id: ${ha_senzory}_humidity_sht45

  - platform: homeassistant
    id: ha_lux
    entity_id: ${ha_senzory}_lux_opt3004

  - platform: homeassistant
    id: ha_nox
    entity_id: ${ha_senzory}_nox_sgp41

  - platform: homeassistant
    id: ha_pressure
    entity_id: ${ha_senzory}_pressure_bmp585

  - platform: homeassistant
    id: ha_temperature
    entity_id: ${ha_senzory}_temperature_sht45

  - platform: homeassistant
    id: ha_voc
    entity_id: ${ha_senzory}_voc_sgp41

text_sensor:
  # Svatky pro stranku page_svatky. Entity dodava HA (rest sensor nad
  # svatkyapi.netlify.app, jeden resource_template na kazdy offset).
  # Bez nich se stranka jen vykresli s "--", nic se nerozbije.
  - platform: homeassistant
    id: ha_svatek_m3
    entity_id: ${ha_svatky | default("sensor.svatek")}_m3

  - platform: homeassistant
    id: ha_svatek_m2
    entity_id: ${ha_svatky | default("sensor.svatek")}_m2

  - platform: homeassistant
    id: ha_svatek_m1
    entity_id: ${ha_svatky | default("sensor.svatek")}_m1

  - platform: homeassistant
    id: ha_svatek_dnes
    entity_id: ${ha_svatky | default("sensor.svatek")}_dnes

  - platform: homeassistant
    id: ha_svatek_p1
    entity_id: ${ha_svatky | default("sensor.svatek")}_p1

  - platform: homeassistant
    id: ha_svatek_p2
    entity_id: ${ha_svatky | default("sensor.svatek")}_p2

  - platform: homeassistant
    id: ha_svatek_p3
    entity_id: ${ha_svatky | default("sensor.svatek")}_p3

color:
  - id: color_bg
    hex: "000000"

  - id: color_arch
    hex: "1793D1"

  - id: color_white
    hex: "FFFFFF"

  # Prahova skala ztlumena o 10 % (kazdy kanal * 0,9), aby tolik nesvitila.
  # Puvodni cisty rozsah byl 00FF00 .. FF0000 pres FFFF00.
  - id: color_green_0
    hex: "00E600"

  - id: color_green_1
    hex: "3AE600"

  - id: color_green_2
    hex: "73E600"

  - id: color_green_3
    hex: "ACE600"

  - id: color_yellow
    hex: "E6E600"

  - id: color_orange_1
    hex: "E6AC00"

  - id: color_orange_2
    hex: "E67300"

  - id: color_orange_3
    hex: "E63A00"

  - id: color_red
    hex: "E60000"

  # Sytejsi fialova: puvodni C040FF mela ve vsech kanalech bily podklad,
  # ted je bez nej a taky ztlumena o 10 %.
  - id: color_purple
    hex: "9000E6"

  - id: color_grid
    hex: "151515"

  - id: color_card
    hex: "141B24"

  - id: color_muted
    hex: "7A8CA0"

graph:
  # Grafy 100 minut
  - id: graph_temp_100m
    duration: 100min
    width: 300
    height: 176
    x_grid: 25min
    y_grid: 1.0
    min_value: 20
    max_value: 27
    border: true
    traces:
      - sensor: ha_temperature
        line_type: SOLID
        line_thickness: 2
        color: color_orange_1

  - id: graph_humidity_100m
    duration: 100min
    width: 300
    height: 176
    x_grid: 25min
    y_grid: 10.0
    min_value: 20
    max_value: 65
    border: true
    traces:
      - sensor: ha_humidity
        line_type: SOLID
        line_thickness: 2
        color: color_green_1

  - id: graph_co2_100m
    duration: 100min
    width: 300
    height: 176
    x_grid: 25min
    y_grid: 300.0
    min_value: 500
    max_value: 2000
    border: true
    traces:
      - sensor: ha_co2
        line_type: SOLID
        line_thickness: 2
        color: color_green_0

  - id: graph_voc_100m
    duration: 100min
    width: 300
    height: 176
    x_grid: 25min
    y_grid: 50.0
    border: true
    traces:
      - sensor: ha_voc
        line_type: SOLID
        line_thickness: 2
        color: color_purple

  - id: graph_nox_100m
