## products/meteohub_karta.yaml
#
# Karticka na dashboard nad UZ EXISTUJICIM senzorem. Nedela zadne cteni --
# jen kresli. Proto se hodi i na LOKALNI senzory desky (sht41, scd40, bmp581),
# ne jen na entity z HA.
#
#   script  karta_${prefix}(x, y)
#
# Na bezny pripad "hodnota z HA + karticka" je meteohub_velicina.yaml, ktery
# senzor zalozi a tenhle balicek si zavola sam.
#
# Vyzaduje products/meteohub_core.yaml a products/meteohub_geo_*.yaml.
#
# Vars:
#   prefix        zaklad id -> karta_${prefix}
#   zdroj         id senzoru, ze ktereho se cte (ha_temp, sht41_temp_raw, ...)
#   popisek       popisek na karte (Teplota)
#   ikona         MDI glyph; musi byt ve font_icons v core
#   jednotka      text pod hodnotou (°C, %, ppm, idx, lx)
#   desetiny      0 nebo 1 -- pocet desetinnych mist
#
#   rezim         jak se pocita barva hodnoty:
#                   0  vzestupna -- 8 prahu ve `prahy`, vzestupne
#                   1  symetricka -- `stred` a `krok`, skala roste na obe strany
#                   2  pevna -- porad `pevna_barva`
#   prahy         8 hodnot vzestupne VE SLOZENYCH ZAVORKACH, napr.
#                 prahy: "{750, 900, 1050, 1200, 1350, 1500, 1650, 1800}"
#                 Ty zavorky tam MUSI byt -- viz komentar u `PRAHY` nize.
#   stred, krok   stred skaly a velikost jednoho stupne (rezim 1)
#   pevna_barva   id barvy (rezim 2, default color_yellow)
#
# Skala ma 9 stupnu: green_0, green_1, green_2, green_3, yellow,
# orange_1, orange_2, orange_3, red.

script:
  # Karta na dashboardu. Volat SYNCHRONNE z lambdy stranky:
  #   id(karta_${prefix})->execute(9, 49);
  # Uvnitr nesmi byt zadny `delay` -- script by se stal asynchronnim
  # a karta by se nevykreslila do aktualniho snimku.
  - id: karta_${prefix}
    mode: single
    parameters:
      x: int
      y: int
    then:
      - lambda: |-
          auto &it = *id(${display_id | default("displej35")});
          // Rozmery z products/meteohub_geo_*.yaml.
          const int CW = ${g_karta_w}, CH = ${g_karta_h};

          const float v = id(${zdroj}).state;
          // Prahovou barvu pocita products/meteohub_skala.yaml (viz `packages:`
          // dole) -- stejny vypocet pak muze pouzit i jina stranka, treba
          // zahlavi hodin, aniz by se logika kopirovala.
          id(skala_${prefix})->execute(v);
          const Color vc = id(barva_${prefix});

          const int L = ${g_karta_okraj}, R = ${g_karta_okraj_p}, PRUH = ${g_karta_pruh};
          const int xr = x + CW - R;

          it.filled_rectangle(x, y, CW, CH, id(color_card));
          it.print(x + L, y + ${g_karta_ikona_y}, id(font_icons), vc, TextAlign::TOP_LEFT, "${ikona}");
          it.print(xr, y + ${g_karta_popisek_y}, id(font_small), id(color_muted), TextAlign::TOP_RIGHT, "${popisek}");
          if (isnan(v)) {
            it.print(xr, y + ${g_karta_hodnota_y}, id(font_value), id(color_muted), TextAlign::TOP_RIGHT, "--");
          } else if (${desetiny | default("0")} == 0) {
            it.printf(xr, y + ${g_karta_hodnota_y}, id(font_value), vc, TextAlign::TOP_RIGHT, "%.0f", v);
          } else {
            it.printf(xr, y + ${g_karta_hodnota_y}, id(font_value), vc, TextAlign::TOP_RIGHT, "%.1f", v);
          }
          it.print(xr, y + ${g_karta_jednotka_y}, id(font_small), id(color_muted), TextAlign::TOP_RIGHT, "${jednotka}");
          it.filled_rectangle(x + CW - 2 * PRUH, y + L, PRUH, CH - 2 * L,
                              isnan(v) ? id(color_grid) : vc);

packages:
  # POZOR: vnorene `!include` se resi RELATIVNE k tomuhle souboru, ne ke koreni
  # konfigurace -- proto bez `products/`.
  skala: !include
    file: meteohub_skala.yaml
    vars:
      prefix: ${prefix}
      rezim: ${rezim | default("0")}
      prahy: ${prahy | default("{0, 0, 0, 0, 0, 0, 0, 0}")}
      stred: ${stred | default("0")}
      krok: ${krok | default("1")}
      pevna_barva: ${pevna_barva | default("color_yellow")}
