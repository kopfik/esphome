## products/meteohub/rotace.yaml
#
# Automaticke prepinani stranek dokola -- "slideshow". Hodi se na fotoramecek
# a na testovani (clovek necha kus bezet a kouka, jestli se vsechny stranky
# vykresli spravne).
#
#   switch  "${volba_name}"     zapina/vypina rotaci, drzi se pres reboot
#   number  "${perioda_name}"   jak casto se prepina, MENITELNE ZA BEHU z HA
#   interval                    tik po sekunde, cas si hlida sam
#
# PO STARTU JE VYPNUTA (restore_mode RESTORE_DEFAULT_OFF). Je to doplnek,
# ne vychozi chovani -- kus, ktery si nikdo nezapne, se chova jako driv.
#
# Rucni prepnuti z HA (select "Aktualni stranka", tlacitka Stranka dalsi /
# predchozi) funguje porad -- rotace jen posune stranku o kus dal, az prijde
# na radu. Kdyz chces zustat na jedne strance, vypni switch.
#
# ---- Perioda ----------------------------------------------------------------
# `perioda` neni pevny `interval:`, ale POCATECNI hodnota number entity.
# Tik je po sekunde a uplynuly cas si lambda pocita sama, takze zmena
# periody v HA se projevi hned a bez prekladu firmware.
#
# Odpocet se restartuje pri zapnuti switche, takze po zapnuti se ceka celou
# periodu a nepreskoci to hned na dalsi stranku.
#
# ---- Rotace jen casti stranek (fotoramecek) ----------------------------------
# Bez `pocet` se toci VSECHNY stranky dokola. Kdyz chces rotovat jen souvisly
# blok -- typicky fotky na konci -- rekni `od` (index prvni stranky bloku)
# a `pocet` (kolik jich je). Pak:
#
#   stranka je v bloku    posune se na dalsi v bloku, za poslednim zpatky na
#                         prvni; z bloku samo nikdy nevyleze
#   stranka je MIMO blok  nedela se nic
#
# To druhe je schvalne: kdyz si na dashboard nebo na graf kliknes rucne,
# rotace te odtud nevytrhne. Vratis se na fotku a zas se to rozjede.
#
# POZOR: `od` je INDEX, tedy poradi stranky v `packages:` pocitane od nuly.
# Nic to nekontroluje -- kdyz pred fotky pridas dalsi stranku, musis `od`
# posunout, jinak bude rotovat neco jineho.
#
# ---- Kam to NEJDE -----------------------------------------------------------
# Vyzaduje products/meteohub/core.yaml (nebo core_touch.yaml, ktery ho
# includuje) -- potrebuje `display_page` a global `stranka_index`.
# Na kus, ktery jede na starem monolitickem products/meteohub.yaml, to
# NEJDE: ten prepina stranky pres `show_page(id(page_x))` a zadny
# `stranka_index` nema.
#
# Na kusu s hodiny_touch.yaml se rotace pere s jeho navratem na klidovou
# stranku (`hodiny_navrat`) -- oba sahaji na stejnou stranku, jen kazdy
# podle sveho. Proto je switch po startu vypnuty.
#
# Vars:
#   perioda        pocatecni perioda v SEKUNDACH (default 60)
#   perioda_min    dolni mez number entity (default 5)
#   perioda_max    horni mez (default 3600)
#   perioda_krok   krok (default 5)
#   volba_name     jmeno switche v HA (default "Rotace stránek")
#   perioda_name   jmeno number entity (default "Rotace stránek: perioda [s]")
#   po_startu      restore_mode switche (default RESTORE_DEFAULT_OFF)
#   od             index prvni stranky rotovaneho bloku (default 0)
#   pocet          kolik stranek blok ma; 0 = vsechny (default 0)
#   display_id

globals:
  # Kdy se naposledy prepnulo. Po rebootu se zacina znovu, drzet to nema smysl.
  - id: rotace_posledni_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

switch:
  - platform: template
    name: "${volba_name | default(\"Rotace stránek\")}"
    id: rotace_stranek
    optimistic: true
    restore_mode: ${po_startu | default("RESTORE_DEFAULT_OFF")}
    on_turn_on:
      # At se po zapnuti ceka cela perioda misto okamziteho skoku.
      - lambda: 'id(rotace_posledni_ms) = millis();'

number:
  - platform: template
    # Jednotka je i v NAZVU schvalne: ESPHome si klic pro restore_value
    # odvozuje z object_id, a to vznika z name. Kdyby se nekdy menily
    # jednotky, musi se zmenit i jmeno, jinak se nacte stara hodnota
    # v puvodnich jednotkach.
    name: "${perioda_name | default(\"Rotace stránek: perioda [s]\")}"
    id: rotace_perioda
    unit_of_measurement: "s"
    min_value: ${perioda_min | default("5")}
    max_value: ${perioda_max | default("3600")}
    step: ${perioda_krok | default("5")}
    initial_value: ${perioda | default("60")}
    optimistic: true
    restore_value: true
    # Posuvnik pres rozsah 5..3600 s krokem 5 se necha ovladat spatne,
    # box jde napsat rovnou.
    mode: box

interval:
  # Tik po sekunde, vlastni odpocet. Pevny `interval: ${perioda}` by sel taky,
  # ale byl by compile-time a v HA by se nedal menit.
  - interval: 1s
    then:
      - if:
          condition:
            switch.is_on: rotace_stranek
          then:
            - lambda: |-
                float per = id(rotace_perioda).state;
                if (std::isnan(per) || per < 1.0f) return;

                // Pretecni millis() resi to, ze je oboji uint32_t -- rozdil
                // vyjde spravne i pres prechod.
                const uint32_t ted = millis();
                if (ted - id(rotace_posledni_ms) < (uint32_t)(per * 1000.0f)) return;
                id(rotace_posledni_ms) = ted;

                const int n = (int) id(display_page).traits.get_options().size();
                if (n <= 0) return;
                const int OD = ${od | default("0")};
                const int POC = ${pocet | default("0")};

                int i = id(stranka_index) % n;
                int cil;
                if (POC > 0) {
                  // Rotuje se jen blok [OD, OD+POC). Mimo nej se nesaha --
                  // rucni volba stranky ma prednost.
                  if (i < OD || i >= OD + POC) return;
                  cil = OD + ((i - OD + 1) % POC);
                } else {
                  cil = (i + 1) % n;
                }

                // Displej umi jen next/prev, tak se k cili dokrouzime --
                // stejne jako select v core.yaml. Pri zabaleni bloku
                // (posledni fotka -> prvni) je to POC-1 kroku dopredu.
                auto &d = *id(${display_id | default("displej35")});
                while (i != cil) { d.show_next_page(); i = (i + 1) % n; }
                id(stranka_index) = cil;
                // Aby select "Aktualni stranka" v HA ukazoval to, co je videt.
                id(display_page).publish_state((size_t) cil);
                // Prekresli se jen kdyz se opravdu prepnulo -- proto je to
                // tady v lambde a ne jako `component.update:` za `if`,
                // ktere by strilelo kazdou sekundu.
                d.update();
