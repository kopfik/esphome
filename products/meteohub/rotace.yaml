## products/meteohub/rotace.yaml
#
# Automaticke prepinani stranek dokola -- "slideshow". Hodi se na fotoramecek
# a na testovani (clovek necha kus bezet a kouka, jestli se vsechny stranky
# vykresli spravne).
#
#   switch  "${volba_name}"   zapina/vypina rotaci, drzi se pres reboot
#   interval                  kazdych ${perioda} skoci na dalsi stranku
#
# Rucni prepnuti z HA (select "Aktualni stranka", tlacitka Stranka dalsi /
# predchozi) funguje porad -- rotace jen posune stranku o kus dal, az prijde
# na radu. Kdyz chces zustat na jedne strance, vypni switch.
#
# ---- Rotace jen casti stranek (fotoramecek) ----------------------------------
# Bez `pocet` se toci VSECHNY stranky dokola. Kdyz chces rotovat jen souvisly
# blok -- typicky fotky na konci -- rekni `od` (index prvni stranky bloku)
# a `pocet` (kolik jich je). Pak:
#
#   stranka je v bloku    posune se na dalsi v bloku, za poslednim zpatky na
#                         prvni; z bloku samo nikdy nevyleze
#   stranka je MIMO blok  nedela se nic
#
# To druhe je schvalne: kdyz si na dashboard nebo na graf kliknes rucne,
# rotace te odtud nevytrhne. Vratis se na fotku a zas se to rozjede.
#
# POZOR: `od` je INDEX, tedy poradi stranky v `packages:` pocitane od nuly.
# Nic to nekontroluje -- kdyz pred fotky pridas dalsi stranku, musis `od`
# posunout, jinak bude rotovat neco jineho.
#
# Index si stejne jako core.yaml pocitame sami (displej umi jen next/prev)
# a po kazdem posunu ho publikujeme do selectu, aby HA neukazovalo neco
# jineho, nez je videt na displeji.
#
# Vyzaduje products/meteohub/core.yaml.
#
# Vars:
#   perioda      jak casto se prepina (default 10s)
#   volba_name   jmeno switche v HA (default "Rotace stránek")
#   po_startu    restore_mode switche (default RESTORE_DEFAULT_ON)
#   od           index prvni stranky rotovaneho bloku (default 0)
#   pocet        kolik stranek blok ma; 0 = vsechny (default 0)
#   display_id

switch:
  - platform: template
    name: "${volba_name | default(\"Rotace stránek\")}"
    id: rotace_stranek
    optimistic: true
    restore_mode: ${po_startu | default("RESTORE_DEFAULT_ON")}

interval:
  - interval: ${perioda | default("10s")}
    then:
      - if:
          condition:
            switch.is_on: rotace_stranek
          then:
            - lambda: |-
                const int n = (int) id(display_page).traits.get_options().size();
                if (n <= 0) return;
                const int OD = ${od | default("0")};
                const int POC = ${pocet | default("0")};

                int i = id(stranka_index) % n;
                int cil;
                if (POC > 0) {
                  // Rotuje se jen blok [OD, OD+POC). Mimo nej se nesaha --
                  // rucni volba stranky ma prednost.
                  if (i < OD || i >= OD + POC) return;
                  cil = OD + ((i - OD + 1) % POC);
                } else {
                  cil = (i + 1) % n;
                }

                // Displej umi jen next/prev, tak se k cili dokrouzime --
                // stejne jako select v core.yaml. Pri zabaleni bloku
                // (posledni fotka -> prvni) je to POC-1 kroku dopredu.
                auto &d = *id(${display_id | default("displej35")});
                while (i != cil) { d.show_next_page(); i = (i + 1) % n; }
                id(stranka_index) = cil;
                // Aby select "Aktualni stranka" v HA ukazoval to, co je videt.
                id(display_page).publish_state((size_t) cil);
            - component.update: ${display_id | default("displej35")}
