## products/meteohub/graf_multi.yaml
#
# Stranka s JEDNIM CTVERCOVYM grafem a legendou NAD nim. Az ctyri cary.
#
#   graph    graf_${prefix}   az ctyri trasy
#   page     page_${prefix}
#   select   polozka "${volba}"
#
# ---- Proc ctverec -----------------------------------------------------------
# graf_2.yaml natahne graf pres celou vysku obsahu a nad nim nechava jen uzky
# pas (${g_graf_zahlavi}), do ktereho se vejde jeden radek. Proto umi presne
# dve cary: vic jmen a hodnot se na jeden radek nevejde.
#
# Kdyz je graf ctverec o strane ${g_graf_w}, zbyde nad nim vyska navic:
#   320x480   obsah 302x422, strana 282  ->  legenda ma 122 px
#   240x320   obsah 222x275, strana 208  ->  legenda ma  53 px
# To je misto na plnohodnotnou legendu -- jmeno vlevo, hodnota vpravo, kazda
# rada v barve sve cary. V plose grafu pak nezustava zadny text krome popisku
# min/max u osy.
#
# ---- Kolik radku, kolik sloupcu ---------------------------------------------
# Rozvrh si lambda pocita sama z vysky fontu a z toho, co zbylo:
#   vejdou se vsechny cary pod sebe   jeden sloupec, jedna cara na radek
#   nevejdou                          dva sloupce (5 car = 3 radky)
# Nic se neoreze, jen se to prerovna:
#   320x480  legenda 120 px, radek 21 px -> 5 radku, tedy pet car v sloupci
#   240x320  legenda  53 px, radek 15 px -> 3 radky, pet car ve dvou sloupcich
#
# Casove okno ("100 min") je VPRAVO V LISTE u nadpisu, ne v legende -- v ni by
# zabiralo cely radek, ktery se hodi na dalsi caru. Lista ma nadpis
# vycentrovany, takze po stranach je volno a `chrome` se kvuli tomu nemeni.
#
# ---- Treti az pata cara jsou nepovinne --------------------------------------
# Vyplnenim `zdroj3`/`popisek3` (a 4, 5) cara pribude, vynechanim zmizi
# z legendy. Trasa v grafu ale existuje vzdycky -- nevyplnena se kresli
# z `zdroj1` a v barve prvni cary, tedy PRESNE PRES ni, takze neni videt.
# Stoji to jeden vzorkovaci buffer navic (sirka grafu * float), nic jineho.
# ESPHome neumi v balicku podminene vynechat kus YAMLu, tohle je nejlacinejsi
# zpusob, jak mit jeden balicek na dve az ctyri cary.
#
# Vyzaduje core.yaml, geo_*.yaml a vsechny senzory ${zdroj*}
# (typicky z velicina.yaml, ktery dela jen senzor a kartu).
#
# ---- Jmenna konvence --------------------------------------------------------
#   graf_*.yaml   JEDEN panel na strance   (graf, graf_2, graf_multi)
#   grafy_*.yaml  DVA panely pod sebou     (grafy, grafy_2) -- 100 min + 25 h
#
# Vars:
#   prefix        zaklad id STRANKY a GRAFU -- nemusi to byt zadny senzor,
#                 stranka je spolecna pro vsechny cary
#   titulek       nadpis stranky, KAPITALKAMA
#   volba         text polozky v selectu prepinani stranek
#   y_grid        roztec vodorovne mrizky
#   strana        vyska grafu v px (default ${g_graf_w}, tedy ctverec).
#                 Zmensenim se legenda zvetsi, zvetsenim naopak.
#   okno          delka casoveho okna (default 100min)
#   x_grid        roztec svisle mrizky (default 25min)
#   popisek_okna  text okna vpravo v liste (default "100 min")
#   jednotka      spolecna jednotka vsech car (°C, %, hPa); pise se za hodnotu
#   font_legenda  font legendy (default font_small)
#
#   zdroj1, popisek1, barva1, format1   prvni cara   POVINNE
#   zdroj2, popisek2, barva2, format2   druha cara   POVINNE
#   zdroj3, popisek3, barva3, format3   treti cara   nepovinne
#   zdroj4, popisek4, barva4, format4   ctvrta cara  nepovinne
#   zdroj5, popisek5, barva5, format5   pata cara    nepovinne
#     zdroj*    id senzoru (ha_temp)
#     popisek*  jmeno v legende; PRAZDNY = cara se v legende neukaze
#     barva*    id barvy cary i jejiho radku v legende. Palety s ni nehybou:
#               GraphTrace si Color zkopiruje pri setup() (graph.h:118).
#     format*   KRATKY printf BEZ jednotky ("%.1f")
#   display_id

graph:
  - id: graf_${prefix}
    duration: ${okno | default("100min")}
    width: ${g_graf_w}
    height: ${strana | default(g_graf_w)}
    x_grid: ${x_grid | default("25min")}
    y_grid: ${y_grid}
    border: true
    traces:
      - sensor: ${zdroj1}
        name: "${popisek1}"
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva1}
      - sensor: ${zdroj2}
        name: "${popisek2}"
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva2}
      - sensor: ${zdroj3 | default(zdroj1)}
        name: "${popisek3 | default(\"\")}"
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva3 | default(barva1)}
      - sensor: ${zdroj4 | default(zdroj1)}
        name: "${popisek4 | default(\"\")}"
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva4 | default(barva1)}
      - sensor: ${zdroj5 | default(zdroj1)}
        name: "${popisek5 | default(\"\")}"
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva5 | default(barva1)}

select:
  - id: !extend display_page
    options:
      - "${volba}"

  - id: !extend uvodni_stranka
    options:
      - "${volba}"

display:
  - id: !extend ${display_id | default("displej35")}
    pages:
      - id: page_${prefix}
        lambda: |-
          it.fill(id(color_bg));
          id(chrome)->execute("${titulek}");

          // Casove okno vpravo v liste. Nadpis je vycentrovany, takze si
          // nepreka; v legende by zabralo cely radek.
          it.print(${g_panel_w} - ${g_ramecek} - ${g_mezera}, (${g_lista_h} - 1) / 2,
                   id(font_small), id(color_muted), TextAlign::CENTER_RIGHT,
                   "${popisek_okna | default("100 min")}");

          // Rozmery z products/meteohub/geo_*.yaml, zadne pevne cislo tady.
          const int OX = ${g_obsah_x}, OY = ${g_obsah_y};
          const int OW = ${g_obsah_w}, OH = ${g_obsah_h};
          const int GX = ${g_graf_x}, GW = ${g_graf_w};
          const int STRANA = ${strana | default(g_graf_w)};
          const int OKRAJ = ${g_graf_okraj};
          const int TY = ${g_panel_text_dy};
          const int PDX = ${g_graf_popisek_dx}, PDY = ${g_graf_popisek_dy};
          const int MEZERA = ${g_sv_mezera};

          it.filled_rectangle(OX, OY, OW, OH, id(color_card));

          // Graf sedi dole, legenda dostane to, co zbylo nahore.
          const int GY = OY + OH - OKRAJ - STRANA;
          const int LY = OY + TY;
          const int LH = GY - LY - 2;

          font::Font *f = id(${font_legenda | default("font_small")});
          auto vyska = [&](font::Font *fo) -> int {
            int w = 0, xo = 0, bl = 0, h = 0;
            fo->measure("Ag", &w, &xo, &bl, &h);
            return h;
          };
          const int RADEK = vyska(f) + 2;
          const int MIST = RADEK > 0 ? LH / RADEK : 0;

          // Cary, ktere maji jmeno, jdou do legendy. Poradi = poradi trasy.
          const char *jmena[5]  = {"${popisek1}", "${popisek2}",
                                   "${popisek3 | default("")}", "${popisek4 | default("")}",
                                   "${popisek5 | default("")}"};
          const char *formaty[5] = {"${format1}", "${format2}",
                                    "${format3 | default("%.1f")}", "${format4 | default("%.1f")}",
                                    "${format5 | default("%.1f")}"};
          float hodnoty[5] = {id(${zdroj1}).state, id(${zdroj2}).state,
                              id(${zdroj3 | default(zdroj1)}).state,
                              id(${zdroj4 | default(zdroj1)}).state,
                              id(${zdroj5 | default(zdroj1)}).state};
          Color barvy[5] = {id(${barva1}), id(${barva2}),
                            id(${barva3 | default(barva1)}), id(${barva4 | default(barva1)}),
                            id(${barva5 | default(barva1)})};

          int poradi[5];
          int n = 0;
          for (int i = 0; i < 5; i++) {
            if (jmena[i][0] != '\0') poradi[n++] = i;
          }

          // Vejdou se vsechny pod sebe? Jinak dva sloupce.
          const int SLOUPCE = (n <= MIST) ? 1 : 2;
          const int CELA_W = GW / SLOUPCE;
          const int y = LY;

          const std::string J = "${jednotka | default("")}";
          for (int k = 0; k < n; k++) {
            const int i = poradi[k];
            const int sl = k % SLOUPCE;
            const int ra = k / SLOUPCE;
            const int x0 = GX + sl * CELA_W;
            // V dvousloupcovem rozvrzeni ma levy sloupec mezeru, aby se
            // hodnota nedotykala jmena vedle.
            const int x1 = x0 + CELA_W - (sl < SLOUPCE - 1 ? MEZERA : 0);
            const int ry = y + ra * RADEK;

            const bool ma = !isnan(hodnoty[i]);
            Color c = ma ? barvy[i] : id(color_muted);
            char hod[24];
            if (ma) snprintf(hod, sizeof(hod), formaty[i], hodnoty[i]);
            else    snprintf(hod, sizeof(hod), "--");
            std::string s = J.empty() ? std::string(hod)
                                      : std::string(hod) + " " + J;

            it.print(x0, ry, f, c, TextAlign::TOP_LEFT, jmena[i]);
            it.print(x1, ry, f, c, TextAlign::TOP_RIGHT, s.c_str());
          }

          it.graph(GX, GY, id(graf_${prefix}), id(color_grid));
          if (!isnan(id(graf_${prefix}).get_graph_limit_max())) {
            it.printf(GX + PDX, GY + PDY, id(font_small), id(color_muted),
                      TextAlign::TOP_LEFT, "%.0f", id(graf_${prefix}).get_graph_limit_max());
            it.printf(GX + PDX, GY + STRANA, id(font_small), id(color_muted),
                      TextAlign::BOTTOM_LEFT, "%.0f", id(graf_${prefix}).get_graph_limit_min());
          }
