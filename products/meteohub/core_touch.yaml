## products/meteohub/core_touch.yaml
#
# Core pro kusy s DOTYKOVYM displejem. Neni to kopie -- includuje
# core.yaml a jen k nemu pridava to, co se bez dotyku nehodi:
#
#   ikony v liste   domecek a sipka zpet vlevo; MENU a OK pribydou
#   obsluha dotyku  domecek -> dashboardy dokola, zpet -> odkud se skocilo,
#                   jinak listovani vlevo/vpravo
#   globaly         touch_cil / touch_x / touch_y (viz nize, proc), historie
#
# Ikony jdou do LISTY, ne do zapati. Lista je 320 px siroka a i nejsirsi
# nadpis (METEOHUB, 142 px) nechava 89 px na kazde strane, tedy misto na dve
# ikony po 36 px vlevo a dve vpravo -- na domecek, zpet, MENU i OK to staci.
# Zapati by ukouslo 49 px z obsahu: karta by spadla ze 101 na 88 px (jednotka
# na y+76 je vysoka 22 px, tedy by pretekla o 10) a graf ze 164 na 139.
# Az bude potreba paty knoflik, prida se zapati OBEMA rodinam naraz.
#
# ---- Jak je poresene poradi obsluhy dotyku ----------------------------------
# Skok z karticky rovnou na jeji grafy dela dashboard_touch.yaml,
# ktery se pripoji AZ ZA tenhle balicek (poradi v `packages:`). Kdyby se
# listovalo uz v `on_touch`, dashboard by pak sahal na stranku, ze ktere se
# mezitim odlistovalo. Proto je to na dve faze:
#
#   on_touch    tady    zapamatuje souradnice a vynuluje touch_cil
#   on_touch    dashboard  kdyz trefil kartu, nastavi touch_cil
#   on_release  tady    kdyz je touch_cil, skoci na nej; jinak domecek/listovani
#
# Uvolneni prijde vzdycky az po vsech `on_touch`, takze na poradi balicku
# uz nezalezi. Vedlejsi efekt: odpada zamek proti opakovanemu vystreleni
# on_touch behem jednoho drzeni, akce se stane jednou pri pusteni.
#
# ---- Tlacitko zpet ----------------------------------------------------------
# Historie si pamatuje jen SKOKY -- klepnuti na kartu, domecek, klepnuti na
# hodiny (touch_cil z jinych balicku). Listovani vlevo/vpravo se nezapisuje:
# z dashboardu na tlak, pak par stranek grafu dal, a zpet vede rovnou na
# dashboard, ne o stranku vlevo.
#
# Stranky PRED prvnim dashboardem (klidova stranka s hodinami) se do historie
# nezapisuji -- vracet se na hodiny nema smysl. Automaticky navrat na hodiny
# (hodiny_touch.yaml) historii maze. Kdyz je historie prazdna, je sipka sede
# a klepnuti na ni nedela nic (ani nelistuje). Uklada se index stranky, ne
# ukazatel -- stejne jako stranka_index v core.yaml.
#
# Nadpis v liste musi zustat uzsi nez misto mezi ikonami: na 320x480 zacina
# sipka na x = 57 (g_lista_ikona2_x) a konci kolem 85, takze nadpis smi mit
# nejvys ~140 px (METEOHUB 143 je na hrane, DASHBOARD 160 uz ne).
#
# Vyzaduje: vsechno co core.yaml, navic `touchscreen:` s id z
# varu touch_id.
#
# Vars:
#   touch_id            id touchscreen komponenty (povinne, napr. touch_4_0)
#   prvni_dashboard     index prvni stranky, ktera je dashboard (default 0).
#                       Kdyz je pred dashboardy jeste klidova stranka
#                       (hodiny.yaml), je to 1.
#   pocet_dashboardu    kolik po sobe jdoucich stranek jsou dashboardy (default 1).
#                       Domecek mezi nimi prepina dokola; z jine stranky
#                       vraci na prvni. Musi sedet s tim, kolik balicku
#                       dashboard.yaml je v `packages:` a kde
#                       v poradi stranek zacinaji.
#   display_id, time_id, page_select_name, schema_select_name
#                       predavaji se rovnou do core.yaml
#   historie_max        kolik skoku si pamatovat (default 10)

packages:
  jadro: !include
    file: core.yaml
    vars:
      display_id: ${display_id | default("displej35")}
      time_id: ${time_id | default("sntp_time")}
      page_select_name: ${page_select_name | default("Aktuální stránka")}
      schema_select_name: ${schema_select_name | default("Barevne schema")}

globals:
  # Kam se ma pri pusteni skocit. nullptr = nikam, resi se listovani.
  - id: touch_cil
    type: display::DisplayPage *
    restore_value: false
    initial_value: 'nullptr'
  - id: touch_x
    type: int
    restore_value: false
    initial_value: '0'
  - id: touch_y
    type: int
    restore_value: false
    initial_value: '0'
  # Indexy stranek, ze kterych se skocilo; posledni je na konci.
  - id: historie
    type: std::vector<int>
    restore_value: false

font:
  # Vlastni, mensi rez ikon: font_icons z core je 36 px na karty, v 43px
  # liste by sedel natesno. Stejny TTF, ESPHome si ho stahne jednou.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_lista
    size: ${g_font_icons_lista}
    glyphs:
      - "\U000F02DC"   # home
      - "\U000F004D"   # arrow-left (zpet)

script:
  # Dokresli ikony do listy, kterou vykreslilo jadro. `!extend` akce PRIDAVA
  # na konec, takze se to nakresli az nad hotovou listu.
  - id: !extend chrome
    then:
      - lambda: |-
          auto &it = *id(${display_id | default("displej35")});
          const int LISTA = ${g_lista_h};
          it.print(${g_lista_ikona_x}, (LISTA - 1) / 2, id(font_icons_lista),
                   id(color_arch), TextAlign::CENTER_LEFT, "\U000F02DC");
          // Zpet: sede, kdyz neni kam.
          it.print(${g_lista_ikona2_x}, (LISTA - 1) / 2, id(font_icons_lista),
                   id(historie).empty() ? id(color_grid) : id(color_arch),
                   TextAlign::CENTER_LEFT, "\U000F004D");

touchscreen:
  - id: !extend ${touch_id}
    on_touch:
      - lambda: |-
          // Jen si zapamatuj, kam se sahlo. Rozhoduje se az pri pusteni --
          // do te doby maji dashboardy sanci nastavit touch_cil.
          id(touch_cil) = nullptr;
          id(touch_x) = touch.x;
          id(touch_y) = touch.y;
    on_release:
      - lambda: |-
          auto &d = *id(${display_id | default("displej35")});
          const int n = (int) id(display_page).traits.get_options().size();
          const int OFF = ${prvni_dashboard | default("0")};
          const int ND = ${pocet_dashboardu | default("1")};
          const bool v_liste = id(touch_y) < ${g_lista_h} + ${g_mezera};

          // Skok z `od` na `kam` se zapise do historie (listovani ne).
          auto zapamatuj = [&](int od, int kam) {
            if (od == kam || od < OFF) return;
            auto &h = id(historie);
            h.push_back(od);
            if ((int) h.size() > ${historie_max | default("10")}) h.erase(h.begin());
          };
          auto jdi_na = [&](int cil) {
            int cur = id(stranka_index) % n;
            while (cur != cil) { d.show_next_page(); cur = (cur + 1) % n; }
            id(stranka_index) = cil;
          };

          if (id(touch_cil) != nullptr) {
            // Dashboard trefil kartu a rekl, kam se ma jit. DisplayPage nema
            // verejne get_next(), takze index cile se necte -- dokrouzime se
            // k nemu pres show_next_page() a kroky si rovnou spocitame.
            // Prekresluje se az pozdejsim component.update, takze je to levne.
            int kroku = 0;
            while (d.get_active_page() != id(touch_cil) && kroku < n) {
              d.show_next_page();
              kroku++;
            }
            if (n > 0) {
              const int od = id(stranka_index) % n;
              id(stranka_index) = (od + kroku) % n;
              zapamatuj(od, id(stranka_index));
            }
            id(touch_cil) = nullptr;
          } else if (v_liste && id(touch_x) < ${g_lista_hotspot_w}) {
            // Domecek v liste. Dashboardy jsou v poradi stranek prvni, takze
            // index mensi nez pocet_dashboardu znamena "stojim na dashboardu".
            // Odtud domecek prepina na DALSI dashboard dokola, odjinud vraci
            // na prvni. Pri jedinem dashboardu se chova jako obycejne "domu".
            if (n > 0) {
              const int cur = id(stranka_index) % n;
              const int cil = (cur >= OFF && cur < OFF + ND)
                              ? OFF + ((cur - OFF + 1) % ND) : OFF;
              zapamatuj(cur, cil);
              jdi_na(cil);
            }
          } else if (v_liste && id(touch_x) < ${g_lista_hotspot2_w}) {
            // Zpet. Prazdna historie = nic, ani nelistovat.
            auto &h = id(historie);
            if (n > 0 && !h.empty()) {
              const int cil = h.back();
              h.pop_back();
              if (cil < n) jdi_na(cil);
            }
          } else if (id(touch_x) < d.get_width() / 2) {
            d.show_prev_page();
            if (n > 0) id(stranka_index) = (id(stranka_index) + n - 1) % n;
          } else {
            d.show_next_page();
            if (n > 0) id(stranka_index) = (id(stranka_index) + 1) % n;
          }
      # Prekresli hned. Bez toho se nova stranka objevi az pri nejblizsim
      # pravidelnem update, tedy az za vterinu -- to je ta "lenost".
      - component.update: ${display_id | default("displej35")}
