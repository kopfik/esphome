## products/meteohub/core.yaml
#
# "Kostra" skladaneho meteohubu. Sama o sobe NIC nekresli -- dodava jen
# spolecne prostredky, ktere si berou dalsi balicky:
#
#   barvy a palety      color_*, script apply_palette, select barevneho schematu
#   fonty               font_title / font_label / font_value / font_small
#                       / font_name / font_icons
#   ramecek + zahlavi   script chrome(titulek)
#   prazdna karta       script karta_prazdna(x, y)  -- pro nevyuzity slot
#   prepinani stranek   select display_page (PRAZDNY!), dve tlacitka,
#                       global stranka_index
#   stranka po startu   select uvodni_stranka (PRAZDNY!), drzi se pres reboot
#   radar               binary_sensor radar_presence_akce (bez akci, viz nize)
#   obnovovani          interval 1s -> update na celou minutu
#
# Politika podsviceni tady taky neni: kazdy kus ji ma jinou (meteohuby podle
# radaru, dotykovy stul podle toho, jestli je na nem klidova stranka), takze
# ji dodava podsviceni_radar.yaml nebo podsviceni_dotyk.yaml.
# Bez jednoho z nich se displej po startu vubec nerozsviti.
#
# Stranky, grafy ani HA senzory tady nejsou. Ty dodavaji dashboard.yaml
# a senzor.yaml -- kazdy si svoji stranku pripoji sam pres
# `display: - id: !extend displej35` a svoji polozku do `display_page`.
#
# POZOR: puvodni monoliticky products/meteohub.yaml zustava beze zmeny a dal
# se pouziva na hotovych nasazenych kusech. Tohle je paralelni vetev,
# neni to nahrada a NEMICHAT je v jednom zarizeni -- kolidovala by id.
#
# ---- Geometrie --------------------------------------------------------------
# Zadne pevne souradnice tady nejsou. Rozmery dodava balicek
# products/meteohub/geo_<sirka>x<vyska>.yaml jako substituce a lambdy si
# z nich zbytek dopocitaji. Jiny displej = jiny geo soubor, tenhle se nemeni.
# Musi byt v `packages:` PRED timhle balickem.
#
# ---- Poradi stranek ----------------------------------------------------------
# `!extend` pripojuje stranky na KONEC, takze poradi stranek = poradi balicku
# v `packages:`. Stejne tak poradi polozek v `display_page`. Ty dva seznamy
# musi sedet na sebe -- prepinani stranek jede podle indexu, ne podle jmena
# stranky. Nic to nekontroluje: kdyz na balicek zapomenes, jen se to rozjede.
#
# Vars:
#   display_id          id displeje (default displej35)
#   time_id             id time komponenty (default sntp_time)
#   page_select_name    jmeno select entity pro prepinani stranek
#   schema_select_name  jmeno select entity pro barevne schema
#
# Device MUSI pred timhle balickem definovat (pevna jmena, nejsou to vars):
#   displej35 / ${display_id}   ili9xxx ST7796, dimensions 320x480
#   sntp_time / ${time_id}      packages/time.yaml
#   display_backlight             components/lights/monochromatic.yaml
#   ld2410c_has_target          components/sensors/ld2410.yaml
#
# Sedmisegmentovka (TM1637) tady NENI -- ne kazdy kus ji ma (dotykovy stolni
# kus na P4 treba ne). Kdo ji ma, prida balicek segment.yaml, ktery si sve akce
# pripoji k radaru i k odpocitavaci podsviceni sam.

esphome:
  on_boot:
    priority: -100
    then:
      # Nejdriv vykreslit (podsviceni je jeste zhasle), az potom rozsvitit --
      # jinak je na displeji zrni z neinicializovaneho bufferu. Rozsviceni
      # samotne uz tady NENI: dela ho balicek s politikou podsviceni, ktery
      # se pripoji za tenhle on_boot (podsviceni_radar.yaml nebo
      # podsviceni_dotyk.yaml).
      - script.execute: apply_palette
      # Skok na stranku ze selectu "Stranka po startu". Musi to byt PRED
      # prvnim `component.update`, jinak by blikla stranka 0. Kdyz select nic
      # ulozeneho nema, zustane prvni stranka -- tedy chovani jako driv.
      - lambda: |-
          // Kdyz select jeste nic ulozeneho nema, active_index() je prazdny
          // a nedela se nic -- zustane stranka 0.
          auto idx = id(uvodni_stranka).active_index();
          const int n = (int) id(uvodni_stranka).size();
          if (idx.has_value() && n > 0) {
            const int cil = (int) *idx;
            auto &d = *id(${display_id | default("displej35")});
            int cur = id(stranka_index) % n;
            while (cur != cil) { d.show_next_page(); cur = (cur + 1) % n; }
            id(stranka_index) = cil;
            // Aby select "Aktualni stranka" v HA neukazoval neco jineho.
            id(display_page).publish_state((size_t) cil);
          }
      - delay: 3s
      - component.update: ${display_id | default("displej35")}

globals:
  # Index barevneho schematu; drzi hodnotu pres reboot, select ho jen prepina.
  - id: paleta
    type: int
    restore_value: true
    initial_value: '0'

  # Ktera stranka je videt. Displej sam index nezna (umi jen next/prev), takze
  # si ho drzime tady a udrzujeme ho v souladu pri kazdem prepnuti.
  # Po rebootu je videt prvni stranka, proto restore_value: false.
  - id: stranka_index
    type: int
    restore_value: false
    initial_value: '0'

color:
  - id: color_bg
    hex: "000000"

  - id: color_arch
    hex: "1793D1"

  - id: color_white
    hex: "FFFFFF"

  # Prahova skala ztlumena o 10 % (kazdy kanal * 0,9), aby tolik nesvitila.
  # Puvodni cisty rozsah byl 00FF00 .. FF0000 pres FFFF00.
  - id: color_green_0
    hex: "00E600"

  - id: color_green_1
    hex: "3AE600"

  - id: color_green_2
    hex: "73E600"

  - id: color_green_3
    hex: "ACE600"

  - id: color_yellow
    hex: "E6E600"

  - id: color_orange_1
    hex: "E6AC00"

  - id: color_orange_2
    hex: "E67300"

  - id: color_orange_3
    hex: "E63A00"

  - id: color_red
    hex: "E60000"

  # Sytejsi fialova: puvodni C040FF mela ve vsech kanalech bily podklad,
  # ted je bez nej a taky ztlumena o 10 %.
  - id: color_purple
    hex: "9000E6"

  - id: color_grid
    # Mrizka a ramecek grafu lezi na podkladu color_card (#141B24), ne na cerne,
    # takze musi byt svetlejsi nez on -- puvodnich #151515 by se v nem ztratilo.
    hex: "26323F"

  - id: color_card
    hex: "141B24"

  - id: color_muted
    hex: "7A8CA0"

  # Tlumena bila (75 % bile, 25 % cerne). Na velke plochy, ktere by v cisté
  # bile prilis zarily -- napr. cislice hodin na klidove strance.
  - id: color_dim
    hex: "BFBFBF"

script:
  # Prepise dve "chromove" barvy podle vybraneho schematu. Prahove barvy
  # (green/yellow/orange/red) se nemeni schvalne - nesou vyznam.
  #
  # Barvy grafovych tras se sem taky netahaji, a nejde to ani technicky:
  # GraphTrace::set_line_color(Color val) si hodnotu ZKOPIRUJE pri setup(),
  # takze pozdejsi zmena color_* uz se do trasy nepromitne (graph.h:118).
  #
  # Pridani dalsiho schematu = jeden radek do PAL nize + jedna polozka do
  # options selectu barevne_schema. Poradi musi sedet, prepina se podle indexu.
  - id: apply_palette
    then:
      - lambda: |-
          //                        akcent              panel
          static const uint8_t PAL[][2][3] = {
            {{0x17, 0x93, 0xD1}, {0x14, 0x1B, 0x24}},   // 0 Arch modra
            {{0x3F, 0xB9, 0x50}, {0x10, 0x1C, 0x13}},   // 1 Zelena
            {{0xE0, 0xA0, 0x30}, {0x1E, 0x18, 0x11}},   // 2 Jantar
            {{0xE8, 0x5D, 0x04}, {0x1A, 0x0E, 0x06}},   // 3 Zhavá
          };
          const int N = sizeof(PAL) / sizeof(PAL[0]);
          int i = id(paleta);
          if (i < 0 || i >= N) i = 0;
          id(color_arch) = Color(PAL[i][0][0], PAL[i][0][1], PAL[i][0][2]);
          id(color_card) = Color(PAL[i][1][0], PAL[i][1][1], PAL[i][1][2]);

  # ---- Spolecny ramecek a zahlavi ----
  # Kresli se ze scriptu, ne v kazde lambde stranky zvlast. Volani z lambdy
  # stranky bezi SYNCHRONNE (SingleScript bez delay), takze to jde do stejneho
  # framebufferu ve stejnem snimku.
  #
  # POZOR: do kresliciho scriptu se NESMI dostat `delay` ani nic cekaciho --
  # tim by se stal asynchronnim a nevykreslil by se.
  - id: chrome
    mode: single
    parameters:
      titulek: string
    then:
      - lambda: |-
          auto &it = *id(${display_id | default("displej35")});
          // Geometrie se pocita z products/meteohub/geo_*.yaml, zadne
          // pevne cislo tady nema co delat.
          const int W = ${g_panel_w}, H = ${g_panel_h};
          const int RAM = ${g_ramecek}, LISTA = ${g_lista_h};
          for (int i = 0; i < RAM; i++) {
            it.rectangle(i, i, W - 2 * i, H - 2 * i, id(color_card));
          }
          it.filled_rectangle(0, 0, W, LISTA, id(color_card));
          // Nadpis na svislem stredu listy (CENTER, aby nesedel jinak podle
          // vysky pisma).
          it.print(W / 2, (LISTA - 1) / 2, id(font_title), id(color_arch),
                   TextAlign::CENTER, titulek.c_str());

  # Nevyuzity slot na dashboardu -- prazdna karta, aby mrizka drzela tvar.
  - id: karta_prazdna
    mode: single
    parameters:
      x: int
      y: int
    then:
      - lambda: |-
          auto &it = *id(${display_id | default("displej35")});
          // Rozmery z products/meteohub/geo_*.yaml.
          const int CW = ${g_karta_w}, CH = ${g_karta_h};
          it.filled_rectangle(x, y, CW, CH, id(color_card));

binary_sensor:
  # Presence/moving/still + number entity pro ladeni radaru dodava package
  # ld2410c; tady se jen doveluji akce na podsviceni a sedmisegmentovku.
  # !extend na ld2410c_has_target NEJDE -- ten senzor je vnoreny v `has_target:`
  # uvnitr platformy, ne samostatna polozka seznamu. Proto kopie pres `copy`.
  # Zadne akce tady nejsou schvalne -- co se ma pri detekci stat, urcuje az
  # balicek s politikou podsviceni (podsviceni_radar.yaml), pripadne
  # segment.yaml. Oba si je sem pripoji pres `!extend`. Kus s
  # dotykovym displejem muze radar nechat bez akci uplne.
  - platform: copy
    source_id: ld2410c_has_target
    id: radar_presence_akce
    internal: true

select:
  - platform: template
    name: "${schema_select_name | default(\"Barevne schema\")}"
    id: barevne_schema
    optimistic: true
    restore_value: true
    options:
      - "Arch modrá"
      - "Zelená"
      - "Jantar"
      - "Žhavá"
    initial_option: "Arch modrá"
    set_action:
      # Podle indexu, ne podle jmena -- pridani schematu je pak jen dalsi
      # polozka nahore + dalsi radek v PAL.
      - lambda: |-
          auto &opts = id(barevne_schema).traits.get_options();
          for (size_t i = 0; i < opts.size(); i++) {
            if (x == opts[i]) { id(paleta) = (int) i; break; }
          }
      - script.execute: apply_palette
      - component.update: ${display_id | default("displej35")}

  # Prazdny schvalne. Kazdy balicek se strankou si svoji polozku pripoji sam:
  #   select:
  #     - id: !extend display_page
  #       options: ["Grafy - Teplota"]
  # Poradi polozek musi sedet na poradi stranek, prepina se podle indexu.
  - platform: template
    name: "${page_select_name | default(\"Aktuální stránka\")}"
    id: display_page
    optimistic: true
    options: []
    set_action:
      - lambda: |-
          auto &opts = id(display_page).traits.get_options();
          const int n = (int) opts.size();
          if (n == 0) return;
          int cil = 0;
          for (int i = 0; i < n; i++) {
            if (x == opts[i]) { cil = i; break; }
          }
          // Displej umi jen next/prev, tak se k cili dokrouzime.
          int cur = id(stranka_index) % n;
          while (cur != cil) {
            id(${display_id | default("displej35")}).show_next_page();
            cur = (cur + 1) % n;
          }
          id(stranka_index) = cil;
      - component.update: ${display_id | default("displej35")}

  # Take prazdny schvalne a extenduje se uplne stejne jako `display_page`:
  #   select:
  #     - id: !extend uvodni_stranka
  #       options: ["Grafy - Teplota"]
  # Oba seznamy tak vyjdou totozne a mistem pravdy zustava poradi balicku.
  # Bez `initial_option` = prvni stranka, tedy to, co to delalo driv.
  - platform: template
    name: "${boot_select_name | default(\"Stránka po startu\")}"
    id: uvodni_stranka
    optimistic: true
    restore_value: true
    options: []

button:
  - platform: template
    name: "Stranka dalsi"
    id: btn_page_next
    on_press:
      - display.page.show_next: ${display_id | default("displej35")}
      # Index si musime dopocitat sami, jinak by se select rozesel s realitou.
      - lambda: |-
          const int n = (int) id(display_page).traits.get_options().size();
          if (n > 0) id(stranka_index) = (id(stranka_index) + 1) % n;
      - component.update: ${display_id | default("displej35")}

  - platform: template
    name: "Stranka predchozi"
    id: btn_page_prev
    on_press:
      - display.page.show_previous: ${display_id | default("displej35")}
      - lambda: |-
          const int n = (int) id(display_page).traits.get_options().size();
          if (n > 0) id(stranka_index) = (id(stranka_index) + n - 1) % n;
      - component.update: ${display_id | default("displej35")}

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              auto time = id(${time_id | default("sntp_time")}).now();
              return time.is_valid() && time.second == 0;
          then:
            - component.update: ${display_id | default("displej35")}

font:
  - file:
      type: gfonts
      family: Ubuntu
      weight: 500
    id: font_title
    size: ${g_font_title}
    glyphsets:
      - GF_Latin_Core
    glyphs:
      # GF_Latin_Core dolni indexy nema, takze zvlast -- kvuli "CO₂".
      # Dolni "x" (U+2093) Ubuntu NEMA, proto se NOx pise obycejnym x.
      - "₂"

  - file:
      type: gfonts
      family: Ubuntu
      weight: 400
    id: font_label
    size: ${g_font_label}
    glyphsets:
      - GF_Latin_Core

  - file:
      type: gfonts
      family: Ubuntu
      weight: 500
    id: font_value
    size: ${g_font_value}
    glyphsets:
      - GF_Latin_Core

  - file:
      type: gfonts
      family: Ubuntu
      weight: 400
    id: font_small
    size: ${g_font_small}
    glyphsets:
      - GF_Latin_Core
    glyphs:
      # GF_Latin_Core dolni indexy nema, takze zvlast -- kvuli "CO₂".
      # Dolni "x" (U+2093) Ubuntu NEMA, proto se NOx pise obycejnym x.
      - "₂"

  - file:
      type: gfonts
      family: Ubuntu
      weight: 500
    id: font_name
    size: ${g_font_name}
    glyphsets:
      - GF_Latin_Core

  # Ikony pro karty. Kdyz bude potreba dalsi, pripoji se pres !extend
  # (v balicku senzoru nebo primo v device YAMLu):
  #   font:
  #     - id: !extend font_icons
  #       glyphs: ["\U000F1234"]
  # Stejny glyph ale nepridavat dvakrat -- ESPHome hlasi duplicitu.
  #
  # Font je PINNUTY na tag v7.4.47 (commit 57b567a4), ne na 'master'. S master
  # by stejny commit tohohle repa za rok mohl vyrobit jiny build: MDI obcas
  # ikony prejmenuje nebo vyradi a kodovy bod (\U000Fxxxx) pak ukazuje jinam
  # nebo nikam. v7.4.47 je verze, ktera byla na master v dobe pinnuti
  # (2026-09-15), takze se vzhled nezmenil. Novejsi verze = zmenit tag ve VSECH
  # souborech naraz (grep MaterialDesign-Webfont) -- ESPHome stahuje soubor podle
  # URL, stejna URL = jedno stazeni, ruzne URL = dva ruzne fonty v cache.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: ${g_font_icons}
    glyphs:
      - "\U000F050F"   # thermometer
      - "\U000F058E"   # water-percent
      - "\U000F07E4"   # molecule-co2
      - "\U000F029A"   # gauge
      - "\U000F01F7"   # emoticon-poop (VOC)
      - "\U000F020F"   # factory (NOx)
      - "\U000F05A8"   # white-balance-sunny
      - "\U000F09D2"   # calendar-heart
