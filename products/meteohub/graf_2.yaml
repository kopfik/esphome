## products/meteohub/graf_2.yaml
#
# Stranka s JEDNIM velkym grafem, v nem DVE cary -- dve veliciny vedle sebe
# (napr. teplota uvnitr a v hajzlu). Protejsek grafy_2.yaml, ktery na stejnou
# plochu narve dva panely (100 min + 25 h) pod sebou.
#
#   graph    graf_${prefix}   dve trasy
#   page     page_${prefix}
#   select   polozka "${volba}"
#
# Proc: na 240x320 vyjde jeden panel z dvojice na 208x104 px, sam na strance
# ma graf 208x245 px. Na 320x480 to funguje stejne (378 px misto 164).
#
# Presne DVE cary, ne "libovolne mnoho". Duvod je stejny jako u grafy_2.yaml:
# zahlavi si jmena a hodnoty kresli samo, aby melo layout pod kontrolou,
# a k tomu je musi znat z varu. Vestavena GraphLegend by je znala, ale
# nepouziva se -- pocita si sirky v Graph::setup(), kdy jsou hodnoty jeste
# NaN, takze rozlozeni neodpovida tomu, co se pak opravdu vypise.
#
# Treti caru lze pridat pres trasa.yaml -- vykresli se, ale v zahlavi uz na
# ni neni misto, takze se tam neobjevi.
#
# Vyzaduje core.yaml, geo_*.yaml a oba senzory ${zdroj1} a ${zdroj2}
# (typicky z velicina.yaml, ktery dela jen senzor a kartu).
#
# Vars:
#   prefix        zaklad id STRANKY a GRAFU (teploty) -- nemusi to byt zadny
#                 senzor, stranka je spolecna pro obe veliciny
#   titulek       nadpis stranky, KAPITALKAMA
#   volba         text polozky v selectu prepinani stranek
#   y_grid        roztec vodorovne mrizky
#   okno          delka casoveho okna (default 100min)
#   x_grid        roztec svisle mrizky (default 25min)
#   popisek_okna  text vlevo nahore (default "100 min")
#   jednotka      spolecna jednotka obou velicin (°C, %, hPa); vypise se jen
#                 kdyz na ni v zahlavi zbyde misto
#
#   zdroj1, popisek1, barva1, format1   prvni cara
#   zdroj2, popisek2, barva2, format2   druha cara
#     zdroj*    id senzoru (ha_temp)
#     popisek*  jmeno v zahlavi (Kopfik)
#     barva*    id barvy cary I jejiho popisku v zahlavi. Palety s ni nehybou:
#               GraphTrace si Color zkopiruje pri setup() (graph.h:118).
#     format*   KRATKY printf BEZ jednotky ("%.1f"), jednotka se pridava zvlast
#   display_id

graph:
  - id: graf_${prefix}
    duration: ${okno | default("100min")}
    width: ${g_graf_w}
    height: ${g_graf_h1}
    x_grid: ${x_grid | default("25min")}
    y_grid: ${y_grid}
    border: true
    traces:
      - sensor: ${zdroj1}
        name: "${popisek1}"
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva1}
      - sensor: ${zdroj2}
        name: "${popisek2}"
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva2}

select:
  - id: !extend display_page
    options:
      - "${volba}"

  - id: !extend uvodni_stranka
    options:
      - "${volba}"

display:
  - id: !extend ${display_id | default("displej35")}
    pages:
      - id: page_${prefix}
        lambda: |-
          it.fill(id(color_bg));
          id(chrome)->execute("${titulek}");

          // Rozmery z products/meteohub/geo_*.yaml, zadne pevne cislo tady.
          // Panel je JEDEN a zabira cely obsah stranky, proto g_obsah_h
          // a g_graf_h1 misto g_gpanel_h a g_graf_h.
          const int OX = ${g_obsah_x}, OY = ${g_obsah_y};
          const int OW = ${g_obsah_w}, OH = ${g_obsah_h};
          const int ZAH = ${g_graf_zahlavi};
          const int GX = ${g_graf_x}, GW = ${g_graf_w}, GH = ${g_graf_h1};
          const int TY = ${g_panel_text_dy};
          const int PDX = ${g_graf_popisek_dx}, PDY = ${g_graf_popisek_dy};

          auto sirka = [&](font::Font *f, const std::string &t) -> int {
            if (t.empty()) return 0;
            int w = 0, x = 0;
            f->measure(t.c_str(), &w, &x, &x, &x);
            return w;
          };

          it.filled_rectangle(OX, OY, OW, OH, id(color_card));

          // Zahlavi na JEDEN radek: okno vlevo, obe veliciny vpravo, kazda
          // barvou sve cary. Vic nez sirka grafu k dispozici neni a sirka
          // hodnot se v case meni, takze se ustupuje po poradi:
          // s jednotkou -> bez jednotky -> jen hodnoty -> zahodit popisek okna.
          // Nejtesnejsi je tlak: "Kopfik 1013" + "Hajzl 1013" + "100 min".
          {
            const int X_R = GX + GW, X_L = GX, SIRKA = GW, MEZERA = ${g_sv_mezera};
            font::Font *f = id(font_small);
            const char *okno = "${popisek_okna | default("100 min")}";

            char h1[24], h2[24];
            bool m1 = !isnan(id(${zdroj1}).state);
            bool m2 = !isnan(id(${zdroj2}).state);
            if (m1) snprintf(h1, sizeof(h1), "${format1}", id(${zdroj1}).state);
            else    snprintf(h1, sizeof(h1), "--");
            if (m2) snprintf(h2, sizeof(h2), "${format2}", id(${zdroj2}).state);
            else    snprintf(h2, sizeof(h2), "--");

            const std::string J = "${jednotka | default("")}";
            std::string s1 = std::string("${popisek1} ") + h1 + (J.empty() ? "" : " " + J);
            std::string s2 = std::string("${popisek2} ") + h2 + (J.empty() ? "" : " " + J);
            int wo = sirka(f, okno);
            auto vejde = [&]() {
              return wo + MEZERA + sirka(f, s1) + MEZERA + sirka(f, s2) <= SIRKA;
            };
            if (!vejde()) {
              s1 = std::string("${popisek1} ") + h1;
              s2 = std::string("${popisek2} ") + h2;
            }
            if (!vejde()) { s1 = h1; s2 = h2; }
            bool ukaz_okno = vejde();

            if (ukaz_okno) {
              it.print(X_L, OY + TY, f, id(color_arch), TextAlign::TOP_LEFT, okno);
            }
            it.print(X_R, OY + TY, f, m2 ? id(${barva2}) : id(color_muted),
                     TextAlign::TOP_RIGHT, s2.c_str());
            it.print(X_R - sirka(f, s2) - MEZERA, OY + TY, f,
                     m1 ? id(${barva1}) : id(color_muted),
                     TextAlign::TOP_RIGHT, s1.c_str());
          }

          it.graph(GX, OY + ZAH, id(graf_${prefix}), id(color_grid));
          if (!isnan(id(graf_${prefix}).get_graph_limit_max())) {
            it.printf(GX + PDX, OY + ZAH + PDY, id(font_small), id(color_muted),
                      TextAlign::TOP_LEFT, "%.0f", id(graf_${prefix}).get_graph_limit_max());
            it.printf(GX + PDX, OY + ZAH + GH, id(font_small), id(color_muted),
                      TextAlign::BOTTOM_LEFT, "%.0f", id(graf_${prefix}).get_graph_limit_min());
          }
