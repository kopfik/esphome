## products/meteohub/graf.yaml
#
# Stranka s JEDNIM velkym grafem jedne veliciny. Protejsek grafy.yaml,
# ktery na stejnou plochu narve dva panely (100 min + 25 h) pod sebou.
#
#   graph    graf_${prefix}
#   page     page_${prefix}
#   select   polozka "${volba}"
#
# K cemu to je: na malem panelu (240x320) vyjde jeden panel z dvojice na
# 208x104 px a mrizka i popisky min/max jsou nahusto. Sam na strance ma graf
# 208x245 px. Na 320x480 to funguje uplne stejne (378 px misto 164) -- kdyz
# chces jednu velicinu velkou pres celou stranku.
#
# Casove okno je parametr, takze stejny balicek udela stranku se 100 min
# i stranku s 25 h -- staci ho zaradit dvakrat s jinym `prefix`... pozor,
# `prefix` urcuje i jmeno senzoru `ha_${prefix}`, takze pro druhe okno nad
# TOUTEZ velicinou pouzij radeji grafy.yaml, nebo si stranky rozliss jinak.
#
# Vyzaduje core.yaml, geo_*.yaml a senzor ha_${prefix} (dodava velicina.yaml).
#
# Na jednu caru. Pro dve pouzij graf_2.yaml (kresli legendu misto jedne
# hodnoty).
#
# Vars:
#   prefix        stejny jako u veliciny -- z nej se odvozuji id
#   titulek       nadpis stranky, KAPITALKAMA
#   volba         text polozky v selectu prepinani stranek
#   format        printf pro hodnotu v zahlavi panelu ("%.1f °C")
#   barva_grafu   id barvy cary. Palety s ni nehybou: GraphTrace si Color
#                 zkopiruje pri setup() (graph.h:118), pozdejsi zmena uz
#                 na caru nema vliv.
#   y_grid        roztec vodorovne mrizky
#   okno          delka casoveho okna (default 100min)
#   x_grid        roztec svisle mrizky (default 25min)
#   popisek_okna  text vlevo nahore (default "100 min")
#   popisek       jmeno trasy (nepovinne, nikde se nekresli)
#   display_id

graph:
  - id: graf_${prefix}
    duration: ${okno | default("100min")}
    width: ${g_graf_w}
    height: ${g_graf_h1}
    x_grid: ${x_grid | default("25min")}
    y_grid: ${y_grid}
    border: true
    traces:
      - sensor: ha_${prefix}
        name: "${popisek | default(\"\")}"
        line_type: SOLID
        line_thickness: 2
        # Bez tohohle kresli ESPHome jen samostatne pixely -- default je
        # continuous_{false} (graph.h). Pri malem rozptylu a kmitajicim
        # cidle z toho jsou nespojite tecky misto cary.
        continuous: true
        color: ${barva_grafu}

select:
  - id: !extend display_page
    options:
      - "${volba}"

  - id: !extend uvodni_stranka
    options:
      - "${volba}"

display:
  - id: !extend ${display_id | default("displej35")}
    pages:
      - id: page_${prefix}
        lambda: |-
          it.fill(id(color_bg));
          id(chrome)->execute("${titulek}");

          // Rozmery z products/meteohub/geo_*.yaml, zadne pevne cislo tady.
          // Panel je JEDEN a zabira cely obsah stranky, proto g_obsah_h
          // a g_graf_h1 misto g_gpanel_h a g_graf_h.
          const int OX = ${g_obsah_x}, OY = ${g_obsah_y};
          const int OW = ${g_obsah_w}, OH = ${g_obsah_h};
          const int ZAH = ${g_graf_zahlavi};
          const int GX = ${g_graf_x}, GW = ${g_graf_w}, GH = ${g_graf_h1};
          const int TY = ${g_panel_text_dy};
          const int PDX = ${g_graf_popisek_dx}, PDY = ${g_graf_popisek_dy};

          // Stejna karta jako na dashboardu: cerna mezera kolem dokola,
          // podklad color_card, graf s vnitrnim okrajem.
          it.filled_rectangle(OX, OY, OW, OH, id(color_card));
          it.print(GX, OY + TY, id(font_small), id(color_arch), TextAlign::TOP_LEFT,
                   "${popisek_okna | default("100 min")}");
          if (!isnan(id(ha_${prefix}).state)) {
            it.printf(GX + GW, OY + TY, id(font_small), id(color_arch),
                      TextAlign::TOP_RIGHT, "${format}", id(ha_${prefix}).state);
          }
          it.graph(GX, OY + ZAH, id(graf_${prefix}), id(color_grid));
          if (!isnan(id(graf_${prefix}).get_graph_limit_max())) {
            it.printf(GX + PDX, OY + ZAH + PDY, id(font_small), id(color_muted),
                      TextAlign::TOP_LEFT, "%.0f", id(graf_${prefix}).get_graph_limit_max());
            it.printf(GX + PDX, OY + ZAH + GH, id(font_small), id(color_muted),
                      TextAlign::BOTTOM_LEFT, "%.0f", id(graf_${prefix}).get_graph_limit_min());
          }
