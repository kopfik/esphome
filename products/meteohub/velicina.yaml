## products/meteohub/velicina.yaml
#
# Hodnota z HA + karticka na dashboard. ZADNA stranka, zadny graf -- ty dodava
# grafy.yaml (nebo grafy_2.yaml, kdyz maji byt na jedne
# strance dve veliciny).
#
#   sensor   ha_${prefix}            hodnota z HA
#   script   karta_${prefix}(x, y)   dodava karta.yaml
#
# Nad LOKALNIM senzorem desky (sht41, scd40, bmp581) tohle nepouzivej --
# na to je rovnou karta.yaml s `zdroj:` na to id.
#
# Vetsinou nechces includovat ani tenhle soubor primo -- na bezny pripad
# "velicina + vlastni stranka s grafy" je senzor.yaml.
#
# Vyzaduje products/meteohub/core.yaml a products/meteohub/geo_*.yaml.
#
# POZOR: vnorene `!include` se resi RELATIVNE k tomuhle souboru, ne ke koreni
# konfigurace -- proto `file: karta.yaml` bez `products/`.
#
# Vars: `entita` (cele entity_id v HA, opsat z HA -- neodvozovat), zbytek se
# preposila do karta.yaml, popis viz tam.

sensor:
  - platform: homeassistant
    id: ha_${prefix}
    entity_id: ${entita}
    internal: true

packages:
  karta: !include
    file: karta.yaml
    vars:
      prefix: ${prefix}
      zdroj: ha_${prefix}
      popisek: ${popisek}
      ikona: ${ikona}
      jednotka: ${jednotka}
      desetiny: ${desetiny | default("0")}
      rezim: ${rezim | default("0")}
      prahy: ${prahy | default("{0, 0, 0, 0, 0, 0, 0, 0}")}
      stred: ${stred | default("0")}
      krok: ${krok | default("1")}
      pevna_barva: ${pevna_barva | default("color_yellow")}
      display_id: ${display_id | default("displej35")}
