## products/meteohub_grafy_2.yaml
#
# Stranka se dvema grafy, v kazdem DVE cary -- dve veliciny vedle sebe
# (napr. teplota uvnitr a v hajzlu). Nahore 100 min, dole 25 h.
#
#   graph    graf_${prefix}_100m / _25h   po dvou trasach
#   page     page_${prefix}
#   select   polozka "${volba}"
#
# Vyzaduje meteohub_core.yaml a oba senzory ${zdroj1} a ${zdroj2}
# (typicky z meteohub_velicina.yaml, ktery dela jen senzor a kartu).
#
# Presne DVE cary, ne "libovolne mnoho". Duvod: zahlavi panelu si jmena
# a hodnoty kresli samo, aby melo layout pod kontrolou, a k tomu je musi znat
# z varu. Vestavena GraphLegend by je znala, ale nepouziva se -- pocita si
# sirky v Graph::setup(), kdy jsou hodnoty jeste NaN, takze rozlozeni neodpovida
# tomu, co se pak opravdu vypise, a hodnoty pretekaly do plochy grafu na
# popisky min/max.
#
# Tretí caru lze pridat pres meteohub_trasa.yaml -- vykresli se, ale v zahlavi
# uz na ni neni misto, takze se tam neobjevi.
#
# Vars:
#   prefix        zaklad id STRANKY a GRAFU (teploty) -- nemusi to byt zadny
#                 senzor, stranka je spolecna pro obe veliciny
#   titulek       nadpis stranky, KAPITALKAMA
#   volba         text polozky v selectu prepinani stranek
#   y_grid_100m   roztec vodorovne mrizky v okne 100 min
#   y_grid_25h    roztec vodorovne mrizky v okne 25 h
#   jednotka      spolecna jednotka obou velicin (°C, %, hPa); vypise se jen
#                 kdyz na ni v zahlavi zbyde misto
#
#   zdroj1, popisek1, barva1, format1   prvni cara
#   zdroj2, popisek2, barva2, format2   druha cara
#     zdroj*    id senzoru (ha_temp)
#     popisek*  jmeno v zahlavi (Kopfik)
#     barva*    id barvy cary I jejiho popisku v zahlavi. Palety s ni nehybou:
#               GraphTrace si Color zkopiruje pri setup() (graph.h:118).
#     format*   KRATKY printf BEZ jednotky ("%.1f"), jednotka se pridava zvlast

graph:
  - id: graf_${prefix}_100m
    duration: 100min
    width: ${g_graf_w}
    height: ${g_graf_h}
    x_grid: 25min
    y_grid: ${y_grid_100m}
    border: true
    traces:
      - sensor: ${zdroj1}
        line_type: SOLID
        line_thickness: 2
        # Bez tohohle kresli ESPHome jen samostatne pixely -- default je
        # continuous_{false} (graph.h).
        continuous: true
        color: ${barva1}
      - sensor: ${zdroj2}
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva2}

  - id: graf_${prefix}_25h
    duration: 25h
    width: ${g_graf_w}
    height: ${g_graf_h}
    x_grid: 6h
    y_grid: ${y_grid_25h}
    border: true
    traces:
      - sensor: ${zdroj1}
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva1}
      - sensor: ${zdroj2}
        line_type: SOLID
        line_thickness: 2
        continuous: true
        color: ${barva2}

select:
  - id: !extend display_page
    options:
      - "${volba}"

display:
  - id: !extend ${display_id | default("displej35")}
    pages:
      - id: page_${prefix}
        lambda: |-
          it.fill(id(color_bg));
          id(chrome)->execute("${titulek}");

          // Rozmery z products/meteohub_geo_*.yaml, zadne pevne cislo tady.
          const int OX = ${g_obsah_x}, OW = ${g_obsah_w};
          const int PH = ${g_gpanel_h};                   // panel jednoho grafu
          const int PY[2] = {${g_gpanel_y1}, ${g_gpanel_y2}};
          const int ZAH = ${g_graf_zahlavi};
          const int GX = ${g_graf_x}, GW = ${g_graf_w}, GH = ${g_graf_h};
          const int TY = ${g_panel_text_dy};
          const int PDX = ${g_graf_popisek_dx}, PDY = ${g_graf_popisek_dy};

          auto sirka = [&](font::Font *f, const std::string &t) -> int {
            if (t.empty()) return 0;
            int w = 0, x = 0;
            f->measure(t.c_str(), &w, &x, &x, &x);
            return w;
          };

          // Zahlavi panelu na JEDEN radek: okno vlevo, obe veliciny vpravo,
          // kazda barvou sve cary. Vic nez sirka grafu (pro 320x480 je to
          // 282 px) k dispozici neni a sirka hodnot se v case meni, takze se
          // ustupuje po poradi:
          // s jednotkou -> bez jednotky -> jen hodnoty -> zahodit popisek okna.
          // Rozhodnuti je pro oba panely spolecne, viz mereni sirky nize.
          // Nejtesnejsi je tlak: "Kopfik 1013" + "Hajzl 1013" + "100 min"
          // je 280 z 282 px, takze na prvni variantu se spolehnout nejde.
          auto zahlavi = [&](int py, const char *okno) {
            const int X_R = GX + GW, X_L = GX, SIRKA = GW, MEZERA = ${g_sv_mezera};
            font::Font *f = id(font_small);

            char h1[24], h2[24];
            bool m1 = !isnan(id(${zdroj1}).state);
            bool m2 = !isnan(id(${zdroj2}).state);
            if (m1) snprintf(h1, sizeof(h1), "${format1}", id(${zdroj1}).state);
            else    snprintf(h1, sizeof(h1), "--");
            if (m2) snprintf(h2, sizeof(h2), "${format2}", id(${zdroj2}).state);
            else    snprintf(h2, sizeof(h2), "--");

            const std::string J = "${jednotka | default("")}";
            std::string s1 = std::string("${popisek1} ") + h1 + (J.empty() ? "" : " " + J);
            std::string s2 = std::string("${popisek2} ") + h2 + (J.empty() ? "" : " " + J);
            // Sirka se meri podle SIRSIHO z obou popisku oken, ne podle toho
            // aktualniho -- jinak by horni panel ("100 min") zahodil jednotku
            // a spodni ("25 h") si ji nechal, a dva panely na jedne strance by
            // vypadaly ruzne.
            int wo = std::max(sirka(f, "100 min"), sirka(f, "25 h"));
            auto vejde = [&]() {
              return wo + MEZERA + sirka(f, s1) + MEZERA + sirka(f, s2) <= SIRKA;
            };
            if (!vejde()) {
              s1 = std::string("${popisek1} ") + h1;
              s2 = std::string("${popisek2} ") + h2;
            }
            if (!vejde()) { s1 = h1; s2 = h2; }
            bool ukaz_okno = vejde();

            if (ukaz_okno) {
              it.print(X_L, py, f, id(color_arch), TextAlign::TOP_LEFT, okno);
            }
            it.print(X_R, py, f, m2 ? id(${barva2}) : id(color_muted),
                     TextAlign::TOP_RIGHT, s2.c_str());
            it.print(X_R - sirka(f, s2) - MEZERA, py, f,
                     m1 ? id(${barva1}) : id(color_muted),
                     TextAlign::TOP_RIGHT, s1.c_str());
          };

          // Panel 100 min -- stejna karta jako na dashboardu: cerna mezera
          // kolem dokola, podklad color_card, graf s vnitrnim okrajem.
          it.filled_rectangle(OX, PY[0], OW, PH, id(color_card));
          zahlavi(PY[0] + TY, "100 min");
          it.graph(GX, PY[0] + ZAH, id(graf_${prefix}_100m), id(color_grid));
          if (!isnan(id(graf_${prefix}_100m).get_graph_limit_max())) {
            it.printf(GX + PDX, PY[0] + ZAH + PDY, id(font_small), id(color_muted),
                      TextAlign::TOP_LEFT, "%.0f", id(graf_${prefix}_100m).get_graph_limit_max());
            it.printf(GX + PDX, PY[0] + ZAH + GH, id(font_small), id(color_muted),
                      TextAlign::BOTTOM_LEFT, "%.0f", id(graf_${prefix}_100m).get_graph_limit_min());
          }

          // Panel 25 h
          it.filled_rectangle(OX, PY[1], OW, PH, id(color_card));
          zahlavi(PY[1] + TY, "25 h");
          it.graph(GX, PY[1] + ZAH, id(graf_${prefix}_25h), id(color_grid));
          if (!isnan(id(graf_${prefix}_25h).get_graph_limit_max())) {
            it.printf(GX + PDX, PY[1] + ZAH + PDY, id(font_small), id(color_muted),
                      TextAlign::TOP_LEFT, "%.0f", id(graf_${prefix}_25h).get_graph_limit_max());
            it.printf(GX + PDX, PY[1] + ZAH + GH, id(font_small), id(color_muted),
                      TextAlign::BOTTOM_LEFT, "%.0f", id(graf_${prefix}_25h).get_graph_limit_min());
          }
